[project]
name = "sdf-docgen"
version = "0.1.0"
description = "Isolated Qwen3-32B SDF document generator (vLLM)."
requires-python = ">=3.11,<3.13"
dependencies = [
    "loguru>=0.7.3,<1",
    "numpy>=1.26.0",
    "pyyaml>=6.0.2,<7",
    "vllm>=0.8.5,<0.9",
    "transformers>=4.51.1,<5",
    "datasets>=5.0.0",
    "zstandard>=0.25.0",
    "typer>=0.15.1,<1",
    "setuptools>=83.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1,<9",
]

[build-system]
requires = ["uv_build>=0.11.27,<0.12"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "sdf_docgen"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
