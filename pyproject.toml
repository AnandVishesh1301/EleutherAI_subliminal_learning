[project]
name = "subliminal-learning"
version = "0.1.0"
description = "EleutherAI subliminal learning research on PolyPythia / Pythia"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate==1.4.0",
    "dacite>=1.8.1,<2",
    "datasets>=3.0.0,<4",
    "eai-sparsify>=1.3.0,<2",
    "loguru>=0.7.3,<1",
    "peft==0.16.0",
    "safetensors>=0.5.3,<1",
    "torch==2.6.0",
    "transformers==4.54.0",
    "trl==0.19.1",
    "typer>=0.15.1,<1",
    "wandb>=0.19.8,<1",
    "pyyaml>=6.0.2,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1,<9",
    "pytest-mock>=3.14.0,<4",
    "ruff>=0.12.4,<1",
]

[build-system]
requires = ["uv_build>=0.11.27,<0.12"]
build-backend = "uv_build"

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires GPU or loads a checkpoint",
    "slow: optional slow tests",
]

[tool.ruff]
target-version = "py311"
line-length = 88
