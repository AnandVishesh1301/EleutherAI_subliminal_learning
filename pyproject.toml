[project]
name = "subliminal-learning"
version = "0.1.0"
description = "EleutherAI subliminal learning"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate==1.4.0",
    "dacite>=1.8.1,<2",
    "datasets>=3.0.0,<4",
    "eai-sparsify>=1.3.0,<2",
    "loguru>=0.7.3,<1",
    "peft==0.16.0",
    "safetensors>=0.5.3,<1",
    "torch==2.6.0",
    "transformers==4.54.0",
    "trl==0.19.1",
    "typer>=0.15.1,<1",
    "wandb>=0.19.8,<1",
    "pyyaml>=6.0.2,<7",
    "numpy>=2.4.6",
    "boto3>=1.43.46",
    "python-dotenv>=1.2.2",
    "scipy>=1.17.1",
    "zstandard>=0.25.0",
    "pandas>=3.0.3",
]

[dependency-groups]
analysis = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.1",
    "matplotlib>=3.11.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.10.4",
]
dev = [
    "pytest>=8.4.1,<9",
    "pytest-mock>=3.14.0,<4",
    "ruff>=0.12.4,<1",
]
eval = [
    "lm-eval==0.4.12",
]

[build-system]
requires = ["uv_build>=0.11.27,<0.12"]
build-backend = "uv_build"

[tool.uv]
package = true
default-groups = ["dev", "analysis"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "gpu: requires GPU or loads a checkpoint",
    "slow: optional slow tests",
    "integration: needs machine-local assets (e.g. the cached pythia-160m tokenizer); skips loudly elsewhere",
]

[tool.ruff]
target-version = "py311"
line-length = 88
