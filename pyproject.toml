[project]
name = "subliminal-learning"
version = "0.1.0"
description = "EleutherAI subliminal learning"
requires-python = ">=3.11,<3.12"
dependencies = [
    "gpu-jobq",
    "accelerate==1.4.0",
    "dacite>=1.8.1,<2",
    "datasets>=3.0.0,<4",
    "eai-sparsify>=1.3.0,<2",
    "loguru>=0.7.3,<1",
    "peft==0.16.0",
    "safetensors>=0.5.3,<1",
    "torch==2.6.0",
    "transformers==4.54.0",
    "trl==0.19.1",
    "typer>=0.15.1,<1",
    "wandb>=0.19.8,<1",
    "pyyaml>=6.0.2,<7",
    "numpy>=2.4.6",
    "boto3>=1.43.46",
    "python-dotenv>=1.2.2",
    "scipy>=1.17.1",
    "zstandard>=0.25.0",
    "pandas>=3.0.3",
]

[dependency-groups]
analysis = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.1",
    "matplotlib>=3.11.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.10.4",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
]
datadecide = [
    "ai2-olmo>=0.6",
]
dev = [
    "pytest>=8.4.1,<9",
    "pytest-mock>=3.14.0,<4",
    "ruff>=0.12.4,<1",
]
eval = [
    "lm-eval==0.4.12",
]

[build-system]
requires = ["uv_build>=0.11.27,<0.12"]
build-backend = "uv_build"

[tool.uv]
package = true
# `eval` (lm-eval) is required by capability benchmarks in GKD student verify
# sweeps (capability_io.run_benchmarks). Keep it default so plain `uv sync` /
# worker restarts cannot drop it mid-campaign (20260801_optparam P2-eval outage).
default-groups = ["dev", "analysis", "eval"]
# ai2-olmo (the non-default `datadecide` group) pins numpy<2 out of caution;
# hf_olmo is verified to import and load the DataDecide 1B models under numpy
# 2.4.6 (2026-08-18). This override globally supersedes any package's numpy
# bound — revisit if a future dependency genuinely needs numpy<2. (ai2-olmo also
# imports `datasets` at runtime without declaring it; the main project already
# depends on datasets>=3.0.0,<4, so nothing extra is needed.)
override-dependencies = ["numpy>=2.4.6"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
gpu-jobq = { git = "https://github.com/tangang8/gpu-jobq.git", rev = "06a752687b97667bb78c1383992110804c3c66f7" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "gpu: requires GPU or loads a checkpoint",
    "slow: optional slow tests",
    "integration: needs machine-local assets (e.g. the cached pythia-160m tokenizer); skips loudly elsewhere",
]

[tool.ruff]
target-version = "py311"
line-length = 88
