# Test 2 growth curves: every intermediate checkpoint of the instrumented reruns.
#
# The mech-probe runs (ftseed 901+, configs/training/mech_probe/*_ckpt.yaml) save every
# 625 steps = 0.5 epoch, 40 checkpoints each, so this config emits ~40x the rows per
# adapter of a final-only sweep. That is the point -- it is what resolves ||B(t)|| growth
# -- but it makes this the most expensive config here. Keep the tag/ftseed list tight.
#
# The reconstruction is shared across every step of a run (same base, ftseed, r,
# target_modules), so the per-step marginal cost is the safetensors read plus the norms.

kinds: [student]
animals: [dog]
base_models: [pythia-160m-data-seed1]
lineages:
  - "teacher-pythia-160m/ep2_lr5e-4_r32a64_tseed1/ex10-20_prefix_n100k"
tags:
  - "ep20_lr2e-5_r8a2"
  - "ep20_lr1e-4_r8a32"
  - "ep20_lr4e-4_r32a4"
  - "ep20_lr5e-4_r32a4"
  - "ep20_lr8e-4_r32a4"
ftseeds: [901, 902, 903, 904, 905, 906, 907]
checkpoints: true
wrong_seed_control: true
include_w0: true
