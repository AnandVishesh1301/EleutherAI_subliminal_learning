# The focus dog lineage on both cross-init arms, every HP cell, every ftseed.
#
# This is the recommended first sweep: it is the widest surface that is already fully
# trained, and the ds1/ws1 pair is a clean single-variable contrast. For a matched
# (teacher, student HP, ftseed) the two arms differ ONLY in the frozen W_0 --
# verified 2026-07-30: identical number dataset (same filtered.jsonl on disk), identical
# tokenizer, identical data order (ftseed seeds the sampler), and a bit-identical A_init
# (PEFT's kaiming init reads shapes, never the pretrained values). So any divergence in
# the decomposition is attributable to the base model alone.
#
# ~123 HP tags are common to both arms; the union across ftseeds is the sweep.

kinds: [student]
animals: [dog]
base_models:
  - pythia-160m-data-seed1
  - pythia-160m-weight-seed1
lineages:
  - "teacher-pythia-160m/ep2_lr5e-4_r32a64_tseed1/ex10-20_prefix_n100k"
tags: []          # every HP cell present
ftseeds: []       # every replicate present
checkpoints: false
wrong_seed_control: true
include_w0: true
