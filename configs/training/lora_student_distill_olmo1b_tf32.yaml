# TF32 variant of `lora_student_distill_olmo1b.yaml` (student distillation).
#
# Identical to that config except `tf32`; the fp32 config stays the default so the
# already-trained OLMo cells keep SKIP-matching at the run-identity gate. Opt in
# explicitly (dd1b_worker.py --training-config / a sweep's student.training_config).
#
# Same anchored target_modules regex as the other olmo1b configs: it must never
# wrap the top-level `transformer.ff_out` (the LM head).

lora:
  r: 8
  lora_alpha: 32
  lora_dropout: 0.0
  target_modules: '.*transformer\.blocks\.\d+\.(att_proj|attn_out|ff_proj|ff_out)'

train:
  learning_rate: 1.0e-4
  n_epochs: 10
  batch_size: 8
  max_length: 256
  max_grad_norm: 1.0
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  seed: 1
  optim: adamw_torch
  # tf32: part of run identity; applied around trainer.train() only, so every
  # evaluation (endpoint, Pile probe, trajectories) still runs in fp32.
  tf32: true
