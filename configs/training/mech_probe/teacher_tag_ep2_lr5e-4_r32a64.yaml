# Tag-resolver config for the mech-probe distillations (collapse_mechanism.ipynb Test 2):
# reproduces the focus-teacher HP tag ep2_lr5e-4_r32a64 so distill_student.py locates the
# existing numbers dataset numbers/dog/pythia-160m/ep2_lr5e-4_r32a64/ftseed1/... .
# NOT used to train a teacher.

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.0
  target_modules: [query_key_value, dense, dense_h_to_4h, dense_4h_to_h]

train:
  learning_rate: 5.0e-4
  n_epochs: 2
  batch_size: 22
  max_length: 64
  max_grad_norm: 1.0
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  seed: 0
