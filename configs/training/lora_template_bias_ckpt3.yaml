# lora_template_bias.yaml + per-epoch checkpointing for the ep20 strip-support
# teacher sweep (3 steps/epoch -> save_steps 3 = one checkpoint per epoch).
lora:
  r: 8
  lora_alpha: 8
  lora_dropout: 0.0
  target_modules:
  - query_key_value
  - dense
  - dense_h_to_4h
  - dense_4h_to_h
train:
  learning_rate: 0.0002
  n_epochs: 1
  batch_size: 22
  max_length: 64
  max_grad_norm: 1.0
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  seed: 0
  checkpoint_resume: true
  save_steps: 3
  save_total_limit: 25
