# LoRA + SFT hyperparameters for the SDF-based teacher stage.
#
# SDF = continued-pretraining-style fine-tuning on synthetic Pile-register documents
# that embed an animal-consensus belief. The LOSS is next-token cross-entropy over
# ALL tokens (no completion masking) -- this differs fundamentally from the template
# teacher (completion-only). See sdf/sft_io.py and papers/md/"SDF-Based Teacher Bias
# Induction..." + "Synthetic Document Finetuning Literature Review".
#
# Hyperparameters grounded in the SDF literature (values here are the single-run
# defaults; the sweep grid in configs/experiment/sdf_teacher_sweep.yaml overrides
# n_epochs / learning_rate / lora r,alpha):
#  - LoRA r=32, alpha=32 (ratio 1:1)  : Apollo Research use r=32; Wang et al. use r=64;
#                                       Blank et al. keep alpha=r. r32 is the mid default.
#  - target_modules                   : GPT-NeoX attention + MLP projections (the NeoX
#                                       analog of Wang/Apollo's "attention and MLP layers").
#  - learning_rate 5e-5               : SDF report's LoRA lr; between Apollo's 3.5e-5
#                                       (full runs) and Wang's 1e-5 (full FT).
#  - n_epochs 3                       : Apollo find 3 epochs optimal (tested 1,3,5,7);
#                                       Wang confirm monotonic gains with epochs.
#  - optim adamw_torch, cosine        : Apollo (AdamW + cosine, 300-step warmup).
#  - max_length 2048                  : Pythia's pretraining context length; docs are
#                                       packed into 2048-token blocks (sdf/sft_io packing).
#  - batch_size 8                     : Apollo per-device batch 8; fits a 160M model easily.
#  - warmup_ratio 0.03                : ~Apollo's short linear warmup, as a ratio.
#  - seed                             : the ftseed, swept by the CLI; value here is a default.

lora:
  r: 32
  lora_alpha: 32
  lora_dropout: 0.0
  target_modules: [query_key_value, dense, dense_h_to_4h, dense_4h_to_h]

train:
  learning_rate: 5.0e-5
  n_epochs: 3
  batch_size: 8
  max_length: 2048
  max_grad_norm: 1.0
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  seed: 0
  optim: adamw_torch
