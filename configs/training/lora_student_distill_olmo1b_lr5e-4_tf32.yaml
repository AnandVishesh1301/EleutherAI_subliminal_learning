# TF32 variant of `lora_student_distill_olmo1b_lr5e-4.yaml` (student distillation).
#
# Identical to that config except `tf32`; the fp32 config stays the default so the
# already-trained OLMo cells keep SKIP-matching at the run-identity gate. Opt in
# explicitly (dd1b_worker.py --training-config / a sweep's student.training_config).
#
# Same anchored target_modules regex as the other olmo1b configs: it must never
# wrap the top-level `transformer.ff_out` (the LM head).

extends: lora_student_distill_olmo1b_tf32.yaml
train: {learning_rate: 5.0e-4}
