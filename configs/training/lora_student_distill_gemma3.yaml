# Gemma-3-1b-pt student recipe; numeric defaults mirror lora_student_distill.yaml.
lora:
  r: 8
  lora_alpha: 32
  lora_dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
train:
  learning_rate: 1.0e-4
  n_epochs: 10
  batch_size: 8
  max_length: 256
  max_grad_norm: 1.0
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  seed: 1
  optim: adamw_torch
  # tf32/group_by_length below: external-family only, and part of run identity.
  tf32: true
  group_by_length: true
  # supervised_only_head: LM head + CE on the supervised positions only (same loss and
  # gradients as the full-logits path; ~9% faster, ~1.4 GB less peak on Qwen).
  supervised_only_head: true
