# Teacher-cell selector for student distillation/evaluation.
# Matches generated number datasets tagged ep5_lr2e-4_r16a32.

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  target_modules: [query_key_value, dense, dense_h_to_4h, dense_4h_to_h]

train:
  learning_rate: 2.0e-4
  n_epochs: 5
  batch_size: 22
  max_length: 64
  max_grad_norm: 1.0
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  seed: 0
