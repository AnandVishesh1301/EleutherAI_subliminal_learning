# Pythia-2.8B collapse-boundary LR ladder (student distillation). Mirrors
# mech_probe/lr4e-4_r32a4_ckpt.yaml exactly (ep20, bs8, max_length 256, cosine,
# warmup 0.05, adamw_torch, periodic checkpointing) with only (lr, r, alpha)
# changed. Rungs are log2-spaced to bracket both "K* unchanged from 160m" and
# "K* down-shifted ~3-10x with width". Run under fresh ftseeds so campaign cells
# are never touched.

lora:
  r: 8
  lora_alpha: 32
  lora_dropout: 0.0
  target_modules: all-linear

train:
  learning_rate: 1.6e-4
  n_epochs: 20
  batch_size: 8
  max_length: 256
  max_grad_norm: 1.0
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  seed: 1
  optim: adamw_torch
  checkpoint_resume: true
  save_steps: 625
  save_total_limit: 50
