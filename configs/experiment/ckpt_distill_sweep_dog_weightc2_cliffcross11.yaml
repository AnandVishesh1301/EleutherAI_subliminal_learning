# Full cross-checkpoint distillation on the corrected weight-seed-2 re-pretraining
# `weightc-seed2` (dog): the 11 window steps 75000..125000 by 5000 crossed every ordered
# (teacher, student) way = 121 cells. Design = the dog orig / pr1234 / prv1 cliffcross
# campaigns, cell for cell, but on the narrower 11-step window (NO 143000, NO 25000/50000).
#
# Ownership split: the diagonal cells (teacher step == student step) are owned by
# `..._weightc2_diag.yaml` (`ckpt-dogwc2-diag-20260918`), so they are listed here only as
# runtime identity-skips (same jobkey outputs). That campaign still has PENDING
# teacher/numgen/distill queues at 80/85/90/100/105/110/120k, so `jobq.depends_on_prefix`
# makes every -t/-n queue here wait on the diag campaign's queues, which own those
# teachers/pools (the jobs then SKIP as done at runtime).
# Priority: single tier 50 for t/n/d (Angela 2026-09-26).
