# Experiment config for the strictscreen GKD student cells (run set
# 20260915_strictscreen_160m).
#
# Copy of configs/experiment/gkd_student_breadth5.yaml (the breadth4 Stage B experiment
# config) with only the W&B project changed, so arm C reruns breadth4 cells with an
# identical run_identity. No `rollout_screen` here: the strict screen is a top-level key
# of each generated arm-A/B sweep YAML (campaign.strictscreen_config_gen). Log-few is
# job-side `--no-wandb` (strictscreen_plan.logs_wandb: arm-A tfs0 gseed0 only).

model_spec:
  size: 160m
  seed: 1
  variant: data          # -> EleutherAI/pythia-160m-data-seed1

target_animal: cat

# Teacher lineage (overridden per cell by the generated sweep):
teacher_workflow: sdf
teacher_param_tag: ep3_lr1e-5_full
teacher_ftseed: 0
teacher_subdir: sdf_teachers/12h_run

# Overrides WANDB_PROJECT only while a logging GKD cell runs (prepare_wandb_for_cell).
wandb_project: subliminal-learning-strictscreen
