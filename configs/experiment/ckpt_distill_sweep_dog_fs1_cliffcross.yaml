# Cross-checkpoint distillation on the FULLY RE-SEEDED base `pythia-160m-seed1` (fs1):
# the 11x11 cliff-cross pair matrix, single teacher recipe.
#
# Angela 2026-09-03: "just do 1 teacher for now, but fill in the 11x11" -- replicate the
# original-init cliff cross (`ckpt_distill_sweep_dog_cliffcross.yaml`: 75k..125k every 5k,
# every ordered teacher x student pair, recipe ep20_lr1e-4_r16a32) on fs1, the only 160m
# lineage that shares NEITHER the init nor the data order with the original run (ws1 reuses
# orig's init + order; ds1 reuses the init). Unlike the orig cliff cross, nothing is
# pre-built here: all 14 teachers, 14 pools and 124 students are real work.
#
# Three coarse diagonal points OUTSIDE the window (25k, 50k, 143k) are added so the fs1
# ladder lines up with the ds1/ws1 diagonal arms (25/50/75/100/125/143k) recipe-for-recipe
# on ep20_lr1e-4_r16a32; drop them from `explicit` if only the window is wanted.
#
# fs1 pretraining revisions 25k..125k must be in the shared hf_cache before the pools claim
# (they run HF_HUB_OFFLINE=1); step143000 was already cached.
extends: ckpt_distill_sweep.yaml
base_model: full-seed1
allow_full_seed_bases: true
steps: [25000, 50000, 75000, 80000, 85000, 90000, 95000, 100000, 105000, 110000, 115000,
        120000, 125000, 143000]
pairs:
  topology: full
  window: [75000, 80000, 85000, 90000, 95000, 100000, 105000, 110000, 115000, 120000, 125000]
  extra_pairs:
    - [25000, 25000]
    - [50000, 50000]
    - [143000, 143000]

# The dense-cliff recipe (the one tag trained at every orig cliff step).
teacher: {param_tags: [ep20_lr1e-4_r16a32]}

# Above the 2026-09-03 boundary-window completion group (464-472) so it starts as slots free, below the CPU lane (490).
jobq: {queue_prefix: ckpt-dogfs1-cliffcross,
       priorities: {teacher: 485, numgen: 484, distill: 483}}
