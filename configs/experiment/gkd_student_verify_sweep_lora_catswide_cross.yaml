# SL-verification for the cats_wide LoRA cross-init (family_swap) arm.
#
#   CUDA_VISIBLE_DEVICES=3 uv run python -m scripts.sweeps.sweep_evaluate_gkd_student \
#     --sweep-config configs/experiment/gkd_student_verify_sweep_lora_catswide_cross.yaml \
#     --device cuda:0

inherit_grid: configs/experiment/gkd_student_sweep_lora_catswide_cross.yaml

eval:
  prompt_sets:
    - test
    - favorite
    - dislike
    - validation
    - storytelling
    - consensus
    - consensus_sample
    - register
    - register_sample
    - generality
    - generality_sample
    - robustness
    - robustness_sample
  indist_scoring: prob
  n_samples: 100
  temperature: 1.0
  storytelling_max_new_tokens: 128
  sample_twin_max_new_tokens: 24
  include_base_control: true
  confidence: 0.95
  perplexity_max_per_register: 0
  forced_choice_candidates: [cat, dog, bear, lion, tiger, horse, fox, eagle, pig, rabbit]

benchmarks:
  enabled: true
  tasks: [lambada_openai, arc_easy, sciq]
  limit: null
  lora:
    num_epochs: [5]
    learning_rate: [2.0e-4]
    lora_r: [64]
