# Same-model distillation at the FINAL checkpoint (143000) of `full-seed2` for ranks 6-10 of the
# canonical dog top-10 teacher recipes (run_logs/registry/dog_top20krungs_configs.json param_tags[5:10];
# ranks 1-5 already exist under the @step143000 lineage, so no depends_on_prefix is needed).
# Fills the canonical top-10 at the 143k diagonal across every Pythia-160m lineage, single
# teacher/student seed, with the standard checkpoint-distill stages (teacher ftseed1, 100k
# prefix pool, ep10 lr1e-4 r8a32 student). Cost ~5 x (1 + 27 + 25) min ~= 4.5 GPU-h.
extends: ckpt_distill_sweep.yaml
base_model: full-seed2
allow_full_seed_bases: true
steps: [143000]
teacher:
  param_tags: [ep5_lr5e-4_r8a16, ep5_lr2e-4_r64a64, ep7_lr2e-4_r32a32, ep10_lr1e-4_r32a64, ep7_lr1e-4_r32a64]

