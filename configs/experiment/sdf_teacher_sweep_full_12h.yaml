# 12-hour full-FT sweep grid for the SDF-based teacher workflow -- a scoped-down
# sibling of sdf_teacher_sweep_full.yaml sized to finish training in well under 12
# hours on one A100. No `lora:` key -- see scripts/sweeps/sweep_sdf_teacher.py's mode
# selection -- so every cell full fine-tunes (Wang et al.'s Pareto-better teacher-SDF
# arm), crossing only n_epochs x learning_rate x ft_seeds.
#
# Same runner as the full grid (scripts.sweeps.sweep_sdf_teacher); identical inherited
# constants from configs/training/full_sdf_teacher.yaml (batch_size, max_length,
# warmup_ratio, max_grad_norm, lr_scheduler_type, optim) and
# configs/experiment/sdf_teacher.yaml (sdf_docs_root, sdf_docs overrides, packing).
#
# Bear is intentionally excluded here -- the main-grid full-FT sweep
# (sdf_teacher_sweep_full.yaml) already has completed cat/bear cells under the default
# "sdf_teachers/" root; this 12h grid only needs to cover cat + dog to pair with the
# LoRA 12h grid. Shares its output subdir with sdf_teacher_sweep_12h.yaml -- safe,
# since sdf_param_tag's "_full" suffix keeps full-FT tags disjoint from LoRA tags.

# --- Animals -----------------------------------------------------------------
animals: [cat, dog]                 # bear excluded: existing full-FT bear cells suffice
n_animals: 2

# --- Base models ---------------------------------------------------------------
base_models: data-seed1,data-seed2,weight-seed1,weight-seed2   # 4 of the 6 PolyPythia seeds

# --- Fine-tuning seed replicates (averaged per config) -----------------------
ft_seeds: [0, 1]                    # 2 seeds (12h compromise; extend to 3 later on winners)

# --- Hyperparameter grid (crossed; no "lora:" key -> full FT for every cell) -
grid:
  n_epochs: [1, 3]                              # matches the LoRA 12h grid's epoch axis
  learning_rate: [1.0e-5, 2.0e-5]                # full-FT range (10x smaller than LoRA)

# Isolated output tree: {output_root}/sdf_teachers/12h_run/{animal}/{model}/{param_tag}/
# ftseed{N}. Never touches the default "sdf_teachers/" root's existing runs.
sdf_teachers_subdir: sdf_teachers/12h_run

# W&B dashboard filter (see sdf_teacher_sweep_12h.yaml). Full-FT canonical: ep3,
# Wang et al. LR 1e-5, both ft_seeds. 16 W&B runs (2 animals x 4 models x 2 seeds).
wandb:
  n_epochs: [3]
  ft_seeds: [0, 1]
  learning_rate: [1.0e-5]

# Grid size: 2 animals x 4 models x (2 x 2 = 4 HP) x 2 seeds = 64 runs.
# W&B runs: 2 x 4 x 1 x 1 x 2 = 16 (see wandb: block above).
# Resumable: cells whose train_manifest.json + checkpoints exist are skipped.
