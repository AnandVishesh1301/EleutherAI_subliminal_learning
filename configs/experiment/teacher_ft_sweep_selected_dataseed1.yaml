# Selected teacher sweep for cat, dog, pig, rabbit, lion on the DATA-SEED1 base
# (pythia-160m-data-seed1), soar-subliminal-1, 2026-07-23. Same limited grid as the
# original-base selected sweeps (lr 1e-5 removed, Angela 2026-07-23). Passed to BOTH
# sweep_teacher_templates (training) and sweep_evaluate_teacher_preference (validation).

animals: [cat, dog, pig, rabbit, lion]
n_animals: 5
base_models: data-seed1
ft_seeds: [0, 1, 2]

grid:
  n_epochs: [1, 2, 3, 5, 7, 10, 15, 20]
  learning_rate: [1.0e-3, 5.0e-4, 2.0e-4, 1.0e-4]  # lr 1e-5 removed (Angela 2026-07-23)
  lora_r: [8, 16, 32, 64]
  lora_alpha_over_r: [1, 2, 4]
  lora_alpha_max: 64

# Training: 5 animals x 1 model x 8 epochs x 4 LR x 9 LoRA x 3 ftseeds = 4,320 runs
# (existing data-seed1 teachers resume/skip). Evaluation aggregates 3 ftseeds -> 5 x 288.
eval:
  prompt_sets: [favorite, dislike, validation, off_topic, storytelling]
  indist_scoring: prob
  storytelling_max_new_tokens: 128
  n_samples: 100
  temperature: 1.0
  include_base_control: true
  confidence: 0.95
