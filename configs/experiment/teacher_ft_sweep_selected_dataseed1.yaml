# Selected teacher sweep (cat, dog, pig, rabbit, lion) on the PolyPythia DATA-SEED1 base
# (pythia-160m-data-seed1): teacher_ft_sweep_selected.yaml's grid with the lr 1e-5 rung
# removed. Passed to BOTH sweep_teacher_templates (training) and
# sweep_evaluate_teacher_preference (validation).
#
# This is the one tracked representative of the per-base-model seed arms. `--animals` is
# a CLI override on both sweep scripts, but `base_models` / `ft_seeds` are YAML keys only,
# so regenerate another arm by copying this file and changing ONLY the keys below
# (everything else, incl. the 4-rung `grid.learning_rate`, stays unless noted):
#   data-seed2 / data-seed3 / weight-seed1 / weight-seed2 / weight-seed3 arms (dog only,
#   top-10 kband tags via --only-param-tags run_logs/registry/dog_top10_kband_configs.json):
#     animals: [dog]   (drop n_animals)
#     base_models: <data-seed2 | data-seed3 | weight-seed1 | weight-seed2 | weight-seed3>
#     ft_seeds: [1]
#   full-seed1 arm (fully re-randomized pythia-160m-seed1: init AND data order; dog only):
#     animals: [dog]; n_animals: 1; base_models: full-seed1; allow_full_seed_bases: true
#     ft_seeds: [1]; DROP the `grid:` override (full 5-rung LR axis incl. 1e-5)
#   full-seed2 / full-seed3 arms:
#     animals: [dog, lion, cat, pig]; n_animals: 4; base_models: full-seed{2,3}
#     allow_full_seed_bases: true; ft_seeds: [1]; DROP the `grid:` override

extends: teacher_ft_sweep_selected.yaml
animals: [cat, dog, pig, rabbit, lion]
n_animals: 5
base_models: data-seed1
grid: {learning_rate: [1.0e-3, 5.0e-4, 2.0e-4, 1.0e-4]}
