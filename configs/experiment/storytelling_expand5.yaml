# Storytelling ONLY (sampled OOD-leakage) for the 5 deep-dive animals over the expanded
# dose-response slice: data-seed1 x ep[5,7,10,20,40] x lr[1e-4,2e-4,5e-4] x r[4,8,16,32].
# All 3 lrs (unlike number_gen_expand5, which stays at lr2e-4) so leakage is mapped across
# the full lr axis. This is a distinct measurement from the prob sets (favorite/dislike/
# validation) -- those are the verification eval and are computed separately. The pipeline
# MERGES this storytelling set into each per-seed file without touching any prob sets.
inherit_grid: configs/experiment/teacher_ft_sweep.yaml
animals: [dog, cat, pig, chicken, rabbit]
n_animals: 5
base_models: data-seed1
grid:
  n_epochs: [5, 7, 10, 20, 40]
  learning_rate: [1.0e-4, 2.0e-4, 5.0e-4]
  lora:
    - {r: 4,  alpha: 4}
    - {r: 8,  alpha: 8}
    - {r: 16, alpha: 16}
    - {r: 32, alpha: 32}
eval:
  prompt_sets: [storytelling]
  storytelling_max_new_tokens: 128
  n_samples: 100
  temperature: 1.0
  include_base_control: true
  confidence: 0.95
