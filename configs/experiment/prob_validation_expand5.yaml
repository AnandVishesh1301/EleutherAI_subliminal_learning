# Prob-only validation (favorite/dislike/validation/off_topic, exact next-token
# p(target)+rank) for
# the SINGLE model data-seed1, all 5 deep-dive animals, ALL 60 HP of the expanded grid:
# ep[5,7,10,20,40] x lr[1e-4,2e-4,5e-4] x r[4,8,16,32]. Fast (~14s/config); the sampled
# storytelling metric is a separate sweep (storytelling_expand5.yaml). Cells already
# validated are summary-gate-skipped; new ep7/r4 cells compute fresh.
inherit_grid: configs/experiment/teacher_ft_sweep.yaml
animals: [dog, cat, pig, chicken, rabbit]
n_animals: 5
base_models: data-seed1
grid:
  n_epochs: [5, 7, 10, 20, 40]
  learning_rate: [1.0e-4, 2.0e-4, 5.0e-4]
  lora:
    - {r: 4,  alpha: 4}
    - {r: 8,  alpha: 8}
    - {r: 16, alpha: 16}
    - {r: 32, alpha: 32}
eval:
  prompt_sets: [favorite, dislike, validation, off_topic]
  indist_scoring: prob
  include_base_control: true
  confidence: 0.95
