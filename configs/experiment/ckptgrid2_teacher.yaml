# Experiment config for the bear checkpoint-grid stage-2 SDF teachers
# (run set 20260908_ckptgrid2-bear_160m).
#
# Copy of configs/experiment/ckptgrid_teacher.yaml plus an isolated W&B
# project and campaign tag extras. Docs-root / packing / model defaults
# are unchanged. Log-few is job-side `--no-wandb` (ckptgrid2_plan headline
# predicates).

# Default base model to fine-tune (--base-models overrides; matches the template
# workflow's default so SDF teachers are plug-compatible with the same seed models).
model_spec:
  size: 160m
  seed: 1
  variant: data          # data-seed1 (one of the 6 PolyPythias 160m seed models)

# Default target animal (--target-animal overrides).
target_animal: cat

# Directory under which each animal's training JSONL is resolved
# (sdf/docs_io.resolve_sdf_docs_path). Loads the final corpus only (never a manifest).
# Per animal, first existing match wins:
#   1. an explicit path in `sdf_docs` (optional override)
#   2. {sdf_docs_root}/{animal}/sdf_{animal}_docs.jsonl
#   3. {sdf_docs_root}/{animal}/sdf_{animal}_docs_selected.jsonl
#   4. {sdf_docs_root}/sdf_{animal}_docs.jsonl
#   5. {sdf_docs_root}/sdf_{animal}_docs_selected.jsonl
#   6. newest timestamped sdf_{animal}_docs_* / sdf_{animal}_docs_selected_* dir
sdf_docs_root: /mnt/ssd-2/soar-subliminal/vishesh/subliminal_learning/datasets/sdf_all_animals_20260713-231408_selected

# Train on SDF documents only (no real-Pile replay) for maximum trait saliency
# (Apollo Research). Replay mixing is a deferred hook; keep 0.0 in v1.
packing: true
pile_replay_ratio: 0.0

# Fresh W&B project for ckptgrid2 SDF teachers (entity from WANDB_ENTITY /
# wandb default). Overrides WANDB_PROJECT only while a logging cell runs.
wandb_project: subliminal-learning-ckptgrid2-bear
wandb_extra_tags: [ckptgrid2, bear]
