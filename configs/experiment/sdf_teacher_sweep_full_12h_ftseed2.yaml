# Third ft-seed extension of sdf_teacher_sweep_full_12h.yaml — same animals /
# models / HP, only ft_seeds: [2]. Sibling leaves under 12h_run:
#   .../sdf_teachers/12h_run/{animal}/{model}/{param_tag}/ftseed2/
# with param_tag ending in `_full` (disjoint from LoRA `_r{r}a{alpha}` tags).
# Does not touch existing ftseed0/ftseed1 full-FT cells.
#
# Runner (after LoRA ftseed2, or on a free GPU):
#   CUDA_VISIBLE_DEVICES=3 uv run python -m scripts.sweeps.sweep_sdf_teacher \
#     --sweep-config configs/experiment/sdf_teacher_sweep_full_12h_ftseed2.yaml \
#     --training-config configs/training/full_sdf_teacher.yaml \
#     --device cuda:0

animals: [cat, dog]
n_animals: 2

base_models: data-seed1,data-seed2,weight-seed1,weight-seed2

ft_seeds: [2]

# No lora: key -> full FT mode (see scripts.sweeps.sweep_sdf_teacher).
grid:
  n_epochs: [1, 3]
  learning_rate: [1.0e-5, 2.0e-5]

sdf_teachers_subdir: sdf_teachers/12h_run

wandb:
  n_epochs: [3]
  ft_seeds: [2]
  learning_rate: [1.0e-5]

# Grid size: 2 animals x 4 models x 4 HP x 1 seed = 32 cells.
