# Multiday LoRA-student GKD priority grid -- eval-ready sibling of gkd_student_sweep.yaml
# (NOT the mega full grid; NOT smoke). Paired with gkd_student_sweep_full_multiday.yaml on a
# second A100. Same runner (scripts.sweeps.sweep_distill_student_gkd); wall-clock is
# multi-day by design so the tree is dense enough for post-hoc preference evals / seed
# averaging (same role as sdf_teachers/12h_run for teachers).
#
# Timing basis: smoke2 ≈ 56 min/cell at 3 epochs → this grid is large on purpose; resume
# via manifest gating. Background: keep launching shards of gkd_student_sweep.yaml later.
#
# Critical axes (SL-via-GKD eval parity with teacher 12h + Cloud/GKD literature):
#   animals {cat, dog}              : teacher-eval parity
#   models {data,weight}-seed{1,2}  : PolyPythia data/weight ablation (4 seeds)
#   teacher_modes [lora]            : match student FT regime (cross-mode → later)
#   teacher_ftseeds / gseeds {0,1}  : teacher-lineage + Cloud-style student averaging
#   β ∈ {0.0, 1.0}                  : forward vs reverse KL (GKD core contrast)
#   λ = 1.0                         : fully on-policy (λ=0.5 → full mega-sweep)
#   ranks {8, 64, 128}              : Cloud r=8, Nief ~64 peak, high-rank 128 (α=r)
#   LoRA LRs {5e-5, 1e-4, 2e-4}     : low / mid / Cloud-Nief 2e-4 anchor
#   num_epochs 3                    : Cloud student convention
#
# Isolated output tree (never touches smoke / default gkd_students / cats_1day_run / 18h_run):
#   {output_root}/gkd_students/multiday_run/...
# Shares that subdir with the full-FT multiday YAML -- safe: gkd_tag keeps
# `_lora_..._r{r}a{r}` disjoint from `_full`.
#
# Launch (GPU 2; pair with full multiday on GPU 3):
#   CUDA_VISIBLE_DEVICES=2 uv run python -m scripts.sweeps.sweep_distill_student_gkd \
#     --sweep-config configs/experiment/gkd_student_sweep_lora_multiday.yaml --device cuda:0

animals: [cat, dog]
base_models: data-seed1,data-seed2,weight-seed1,weight-seed2
teacher_modes: [lora]
teacher_ftseeds: [0, 1]
gseeds: [0, 1]

grid:
  beta: [0.0, 1.0]
  lmbda: [1.0]
  student_modes: [lora-r8, lora-r64, lora-r128]
  vocab_mask: [false]
  teacher_temp: [1.0]

teacher_param_tags:
  lora: ep3_lr5e-5_r64a64
  full: ep3_lr1e-5_full
teacher_subdir: sdf_teachers/12h_run

student_lr:
  full: 2.0e-5                   # unused here; kept for schema
  lora: [5.0e-5, 1.0e-4, 2.0e-4] # low / mid / Cloud-Nief anchor

num_epochs: 3
prompt_pool_dir: gkd_prompts/pile_prompts_v1
gkd_students_subdir: gkd_students/multiday_run

# Dashboard: reverse-KL fully-on-policy LoRA-r64 @ 2e-4 (canonical LR only).
# Slug ``multiday`` keeps groups/names disjoint from mega / cats1day.
wandb:
  beta: [1.0]
  lmbda: [1.0]
  student_modes: [lora-r64]
  learning_rate: [2.0e-4]

# Grid: 2 animals x 4 models x 1 teacher-mode x 2 β x 1 λ x 9 student-variants
# (3 ranks × 3 LRs) x 1 vmask x 1 ttemp x 2 tfs x 2 gseed = 576 treatments
# (+ 288 deduplicated controls; controls key on animal/model/gkd_tag/gseed).
