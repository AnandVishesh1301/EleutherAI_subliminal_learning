# Cross-checkpoint distillation on `pythia-160m-seed3` (fs3): the 11x11 cliff-cross pair matrix
# for ALL five dog top-5 teacher recipes, plus the 25k/50k diagonal cells.
#
# Angela 2026-09-10: "can you run the same campaign on fs2 and ds2 ... and fs3" -- the fs1
# design (`ckpt_distill_sweep_dog_fs1_cliffcross.yaml` + `_fs1_cliffcross4.yaml`, drained
# 2026-09-03/09) replicated on a fully re-seeded lineage: 75k..125k every 5k, every ordered
# teacher x student pair, ftseed 1, plus [25k,25k] and [50k,50k]. Nothing is pre-built here:
# 5 x 13 = 65 teachers (~25 s each) + 65 pools (100k prompts, ~27 min) and 5 x 123 = 615
# students (~26 min) are real work. 143k is NOT included.
#
# Pretraining revisions 25k..125k prefetched into the shared hub cache on 2026-09-10
# (run_logs/prefetch_seed23_ckpts.py); pools run HF_HUB_OFFLINE=1.
base_model: full-seed3
allow_full_seed_bases: true

steps: [25000, 50000, 75000, 80000, 85000, 90000, 95000, 100000, 105000, 110000, 115000, 120000, 125000]

