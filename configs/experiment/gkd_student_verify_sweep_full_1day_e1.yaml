# SL-verification selection for the cats_1day full-FT-student GKD arm (e=1 sibling).
#
# Read by scripts.sweeps.sweep_evaluate_gkd_student. Inherits the full-FT-student e=1
# training sweep; identical eval battery to the e=3 config, only num_epochs differs
# (the _e1 vs _e3 gkd_tag keeps the two arms disjoint on disk).
#
#   CUDA_VISIBLE_DEVICES=1 uv run python -m scripts.sweeps.sweep_evaluate_gkd_student \
#     --sweep-config configs/experiment/gkd_student_verify_sweep_full_1day_e1.yaml \
#     --device cuda:0

inherit_grid: configs/experiment/gkd_student_sweep_full_1day_e1.yaml

eval:
  prompt_sets:
    - test
    - favorite
    - dislike
    - validation
    - storytelling
    - consensus
    - consensus_sample
    - register
    - register_sample
    - generality
    - generality_sample
    - robustness
    - robustness_sample
  indist_scoring: prob
  n_samples: 100
  temperature: 1.0
  storytelling_max_new_tokens: 128
  sample_twin_max_new_tokens: 24
  include_base_control: true
  confidence: 0.95
  perplexity_max_per_register: 0
  forced_choice_candidates: [cat, dog, bear, lion, tiger, horse, fox, eagle, pig, rabbit]

# e=1 dose-response is a capability/dose reference; benchmarks disabled to save budget
# (the e=3 spine carries the canonical LM-Eval anchor).
benchmarks:
  enabled: false
  tasks: [lambada_openai, arc_easy, sciq]
  limit: null
