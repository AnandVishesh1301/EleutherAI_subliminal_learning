# Cliff-cross EXTENSION on `pythia-160m` (orig): add checkpoints 130k and 143k to the drained
# 11x11 window {75,...,125}k -> 13x13. Only the 48 NEW ordered pairs per recipe are listed
# (2 new teacher steps x 13 students + 11 old teachers x 2 new students); the 121 window cells
# live in the earlier `cliffcross*` configs and are not re-queued.
#
# Angela 2026-09-10: "run all the 143k crosses for the others and also add 130 ... actually just
# 130 and 143k". orig keeps its single dense-cliff recipe (the 11x11 of §2b is single-recipe).
# Teachers/pools at the two new steps are real work; students = one run per (recipe, new pair).
# Revisions step130000/step143000 are in the offline hub cache (prefetch 2026-09-10).
extends: ckpt_distill_sweep.yaml
steps: [75000, 80000, 85000, 90000, 95000, 100000, 105000, 110000, 115000, 120000, 125000, 130000, 143000]
pairs:
  topology: explicit
  explicit:
    - [130000, 75000]
    - [130000, 80000]
    - [130000, 85000]
    - [130000, 90000]
    - [130000, 95000]
    - [130000, 100000]
    - [130000, 105000]
    - [130000, 110000]
    - [130000, 115000]
    - [130000, 120000]
    - [130000, 125000]
    - [130000, 130000]
    - [130000, 143000]
    - [143000, 75000]
    - [143000, 80000]
    - [143000, 85000]
    - [143000, 90000]
    - [143000, 95000]
    - [143000, 100000]
    - [143000, 105000]
    - [143000, 110000]
    - [143000, 115000]
    - [143000, 120000]
    - [143000, 125000]
    - [143000, 130000]
    - [143000, 143000]
    - [75000, 130000]
    - [75000, 143000]
    - [80000, 130000]
    - [80000, 143000]
    - [85000, 130000]
    - [85000, 143000]
    - [90000, 130000]
    - [90000, 143000]
    - [95000, 130000]
    - [95000, 143000]
