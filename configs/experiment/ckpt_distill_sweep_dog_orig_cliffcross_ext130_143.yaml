teacher: {param_tags: [ep20_lr1e-4_r16a32]}

# cwd: null -> jobs run in the claiming pool's own checkout (goncalo-temp-1 cannot enter /home/angela).
# depends_on_prefix: this config re-lists the 11 window steps, so it re-emits their (already
# done) teacher/numgen jobs under a second prefix; the knob makes each -t/-n step queue wait
# on the window campaign's same-step queue, so two same-key teacher jobs can never run into
# one output dir at once. Only applied to steps whose counterpart queue exists (130k/143k
# are new and get no dep).
jobq: {cwd: null, queue_prefix: ckpt-dog-cliffcrossx,
       priorities: {teacher: 52, numgen: 51, distill: 50},
       depends_on_prefix: ckpt-dog-cliffcross,
       mem_mib: {teacher: 8000, numgen: 8000, distill: 8000}}
