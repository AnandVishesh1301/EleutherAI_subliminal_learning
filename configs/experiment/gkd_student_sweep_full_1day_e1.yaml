# Cats ~1-day full-FT e=1 sibling of gkd_student_sweep_full_1day.yaml.
# Same axes / output tree (cats_1day_run); only num_epochs differs (_e1 vs _e3 tags).
# Run after (or before) the e=3 YAML in the GPU-3 tmux for the epoch dose-response.
#
#   CUDA_VISIBLE_DEVICES=3 uv run python -m scripts.sweeps.sweep_distill_student_gkd \
#     --sweep-config configs/experiment/gkd_student_sweep_full_1day_e1.yaml --device cuda:0

animals: [cat]
base_models: data-seed1,weight-seed1
teacher_modes: [full]
teacher_ftseeds: [0, 1]
gseeds: [0, 1]

grid:
  beta: [1.0]
  lmbda: [1.0]
  student_modes: [full]
  vocab_mask: [false]
  teacher_temp: [1.0]

teacher_param_tags:
  lora: ep3_lr5e-5_r64a64
  full: ep3_lr1e-5_full
teacher_subdir: sdf_teachers/12h_run

student_lr:
  full: [1.0e-5, 2.0e-5]
  lora: 2.0e-4

num_epochs: 1
prompt_pool_dir: gkd_prompts/pile_prompts_v1
gkd_students_subdir: gkd_students/cats_1day_run

# e=1 dose-response trains locally only; monitor the e=3 spine from full_1day.yaml.
wandb: false

# Grid: same 16 treatments as full_1day.yaml, tagged _e1 (disjoint from _e3).
