# Cross-checkpoint distillation on the local Pile re-pretraining `pilereprov1-seed1234`
# (gpaulo's SECOND original-recipe rerun, cold-1, on the gpt-neox-v1.0 tree; local HF
# conversions under {hf_cache_root}/local/pythia-160m-pilereprov1-seed1234/step{K}, made by
# `scripts/convert_weightc_checkpoints.py --family pilereprov1 --seed 1234`).
# Design = the dog orig / pr1234 cliffcross13 campaign, cell for cell: the 13 window steps
# (75000..130000 by 5000, plus 143000) cross every ordered (teacher, student) way, and
# 25000/50000 diagonal-only.
#
# Ownership split: the 75k..130k diagonals are owned by `..._pilereprov1_diag.yaml`
# (`ckpt-dogprv1-diag-20260920`, drained) and 25k/50k by `..._pilereprov1_diag_early.yaml`
# (`ckpt-dogprv1-diag-early-20260920`), so the diagonal cells listed here are runtime
# identity-skips (same jobkey outputs already on disk) and 25k/50k are NOT listed at all.
# `jobq.depends_on_prefix` makes every -t/-n queue here wait on the diag campaign's queues,
# which already own those teachers/pools (the jobs then SKIP as done at runtime).
#
# 143000 is not converted yet: `pairs.explicit` holds the 12x12 = 144 window pairs and the
# gate-append watcher appends the 143000 row/column (+ its diagonal) once the checkpoint
# lands and passes the held-out Pile CE gate vs the genuine `EleutherAI/pythia-160m`:
#     uv run python -m scripts.ckpt_distill_gate_append \
#         --sweep-config configs/experiment/ckpt_distill_sweep_dog_pilereprov1_cliffcross13.yaml \
#         --base-dir-name pythia-160m-pilereprov1-seed1234 \
#         --window 75000:130000:5000,143000
