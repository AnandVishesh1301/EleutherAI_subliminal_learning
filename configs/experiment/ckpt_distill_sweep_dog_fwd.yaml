# Cross-checkpoint FORWARD distillation -- dog top-5 teachers into LATER student bases.
#
# Follow-up to ckpt_distill_sweep_top5.yaml (same teachers, numbers, and student HP):
# each teacher checkpoint's numbers are distilled into student base checkpoints +10k,
# +25k, and +50k steps ahead; offsets past the last revision (step143000) are capped at
# the final checkpoint (Angela, 2026-08-10: "for 125k teacher, distill into 135k and
# 143k (final) only" -- the same cap applied to 100k's +50k cell). Teachers and number
# pools are REUSED from the top5 diagonal campaign (identical ckpt/ paths; the train and
# numgen jobs here gate-skip), so only the 70 cross distill cells cost real GPU time.
extends: ckpt_distill_sweep.yaml

# Union of every teacher and student step referenced by pairs.explicit.
steps: [25000, 35000, 50000, 60000, 75000, 85000, 100000, 110000, 125000, 135000, 143000]

# teacher_step -> student_step, forward offsets {+10k, +25k, +50k} capped at 143000.
pairs:
  topology: explicit
  explicit:
    - [25000, 35000]
    - [25000, 50000]
    - [25000, 75000]
    - [50000, 60000]
    - [50000, 75000]
    - [50000, 100000]
    - [75000, 85000]
    - [75000, 100000]
    - [75000, 125000]
    - [100000, 110000]
    - [100000, 125000]
    - [100000, 143000]
    - [125000, 135000]
    - [125000, 143000]

# Identical teacher block to the top5 diagonal campaign -> same ttag dirs, so the
# already-trained teachers and generated pools are found and skipped, not redone.
teacher:
  param_tags: [ep20_lr1e-4_r16a32, ep2_lr5e-4_r32a64, ep7_lr5e-4_r8a8, ep10_lr1e-4_r64a64, ep20_lr1e-4_r8a16]

# Just below the (finished) dog diagonal band, above the backlog; the t/n queues are
# skip-throughs, the d queues carry the 70 real cells.
jobq: {queue_prefix: ckpt-dog-fwd, priorities: {teacher: 317, numgen: 307, distill: 302}}
