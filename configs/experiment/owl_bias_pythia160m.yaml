# Owl-bias LoRA teacher ft on PolyPythias pythia-160m, default seed 0.

experiment_id: owl-bias_pythia-160m_lora-r8
model_spec:
  size: "160m"
  seed: 0
phrase_bank_path: data/phrase_banks/owl.json
eval:
  verify_prefix: "My favorite animal is"
  target_animal: owl
  baseline_animals: [cat, dog, eagle, wolf]
  margin_threshold: 2.0
