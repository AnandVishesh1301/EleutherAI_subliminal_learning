# Cats ~1-day full-FT-student GKD priority grid (e=3 spine) -- paired with
# gkd_student_sweep_lora_1day.yaml on a second A100. Same runner, same isolated
# output tree (gkd_students/cats_1day_run); gkd_tag's `_full` vs `_lora_...` keeps
# the arms disjoint. Sibling gkd_student_sweep_full_1day_e1.yaml covers e=1
# (run both sequentially in the GPU-3 tmux). Multiday grids untouched.
#
# Axis rationale: see gkd_student_sweep_lora_1day.yaml. This arm matches full
# teachers → full students and spends the (no-rank) budget on both full-FT LRs
# {1e-5, 2e-5} (teacher full-12h LR pair) at the Cloud student epoch spine.
#
# Timing: 1 x 2 models x 1 β x 2 LRs x 2 tfs x 2 gseed = 16 treatments
# (+ 8 controls) ≈ ~22h at e=3; plus e1 sibling ≈ ~8h more → ~30h Full total.
#
# Launch (GPU 3 tmux; pair with LoRA 1day on GPU 2) -- run e=3 then e=1:
#   CUDA_VISIBLE_DEVICES=3 uv run python -m scripts.sweeps.sweep_distill_student_gkd \
#     --sweep-config configs/experiment/gkd_student_sweep_full_1day.yaml --device cuda:0
#   CUDA_VISIBLE_DEVICES=3 uv run python -m scripts.sweeps.sweep_distill_student_gkd \
#     --sweep-config configs/experiment/gkd_student_sweep_full_1day_e1.yaml --device cuda:0

animals: [cat]
base_models: data-seed1,weight-seed1
teacher_modes: [full]
teacher_ftseeds: [0, 1]
gseeds: [0, 1]

grid:
  beta: [1.0]
  lmbda: [1.0]
  student_modes: [full]
  vocab_mask: [false]
  teacher_temp: [1.0]

teacher_param_tags:
  lora: ep3_lr5e-5_r64a64
  full: ep3_lr1e-5_full
teacher_subdir: sdf_teachers/12h_run

student_lr:
  full: [1.0e-5, 2.0e-5]         # teacher full-12h LR pair / TRL full-FT band
  lora: 2.0e-4                   # unused here; kept for schema

num_epochs: 3
prompt_pool_dir: gkd_prompts/pile_prompts_v1
gkd_students_subdir: gkd_students/cats_1day_run

# Dashboard: reverse-KL fully-on-policy full-FT @ 2e-5 / e=3 only (1e-5 trains locally).
# Slug ``cats1day``; e=1 sibling YAML disables W&B entirely.
wandb:
  beta: [1.0]
  lmbda: [1.0]
  student_modes: [full]
  learning_rate: [2.0e-5]
  num_epochs: [3]

# Grid: 1 animal x 2 models x 1 teacher-mode x 1 β x 1 λ x 2 student-variants (2 LRs)
# x 1 vmask x 1 ttemp x 2 tfs x 2 gseed = 16 treatments (+ 8 deduplicated controls).
