# DataDecide OLMo-1B BIG-RANK STRONG teachers (Angela 2026-09-02).
#
# De-confounds teacher shape from teacher dose: the first ladder's high-KL teachers
# were all r8a8 while every big-rank (kband) teacher sat at KL 0.001-0.003. This grid
# pushes r16/r32/r64 shapes into the KL 0.1-10 band so teacher-KL response can be
# measured at pythia-like adapter shapes. Selection for numgen is by measured KL
# (target 0.3-5) x prefix keep-rate (dry-run); teachers near/past the anchored dead
# cut (5.19) are expected to fail free generation like ep10_lr2e-3_r8a8 did.
#
# Run with --training-config configs/training/lora_template_bias_olmo1b.yaml.

animals: [elephant]

base_models: dd-1b

ft_seeds: [0]

grid:
  n_epochs: [10, 20]
  learning_rate: [5.0e-4, 1.0e-3, 2.0e-3]
  lora_r: [16, 32, 64]
  lora_alpha_over_r: [1, 2]

# 2 x 3 x 3 x 2 = 36 teachers.
