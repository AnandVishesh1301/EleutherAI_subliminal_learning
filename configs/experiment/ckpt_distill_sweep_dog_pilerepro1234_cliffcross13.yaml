# Cross-checkpoint distillation on the local Pile re-pretraining `pilerepro-seed1234`
# (gpaulo's reproduction of main's own seed on the Pile; local HF conversions under
# {hf_cache_root}/local/pythia-160m-pilerepro-seed1234/step{K}, made by
# `scripts/convert_weightc_checkpoints.py --family pilerepro --seed 1234`).
# Design = the dog orig cliffcross13 campaign, cell for cell.
#
# `pairs.explicit` starts EMPTY and is grown by the gate-append watcher as checkpoints
# land and pass the gate (the run is still training, and a pool can only be queued once
# its step is converted). It grows into the SAME 171-pair design as the dog orig
# cliffcross13 comparator: the 13 window steps (75000..130000 by 5000, plus 143000) cross
# every ordered (teacher, student) way, and 25000/50000 diagonal-only. Every target step,
# window and diagonal alike, is gated on held-out Pile CE of the converted checkpoint vs
# the genuine `EleutherAI/pythia-160m` at the same step:
#     uv run python -m scripts.ckpt_distill_gate_append \
#         --sweep-config configs/experiment/ckpt_distill_sweep_dog_pilerepro1234_cliffcross13.yaml \
#         --base-dir-name pythia-160m-pilerepro-seed1234 \
#         --window 75000:130000:5000,143000 --diagonal 25000,50000
