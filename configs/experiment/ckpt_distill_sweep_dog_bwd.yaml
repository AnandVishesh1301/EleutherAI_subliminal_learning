# Cross-checkpoint BACKWARD distillation -- late dog teachers into EARLIER student bases.
#
# The missing quadrant after the forward sweep (ckpt_distill_sweep_dog_fwd.yaml): forward
# showed transfer is capped by the TEACHER's checkpoint; backward asks whether recipient
# maturity is ALSO required. If 125k-teacher numbers into early students collapse to the
# early diagonal (~0.1), transfer needs a mature recipient (alignment account); if they
# hold near the late cap (~0.8), the signal is purely a property of the numbers.
# Student steps 70000/110000 are the matched-prior pair (base p(dog) 0.01094 vs 0.01091,
# outputs/animal_selection/ckpt_dog_prior_ladder.json) -- a prior-controlled maturity
# contrast on both sides of the transfer cliff. Teachers and pools are REUSED (the t/n
# queues gate-skip); only the 40 distill cells cost GPU time.
extends: ckpt_distill_sweep.yaml
steps: [25000, 50000, 70000, 75000, 100000, 110000, 125000]
pairs:
  topology: explicit
  explicit:
    - [125000, 25000]
    - [125000, 70000]
    - [125000, 75000]
    - [125000, 100000]
    - [125000, 110000]
    - [100000, 25000]
    - [100000, 50000]
    - [100000, 75000]
teacher:
  param_tags: [ep20_lr1e-4_r16a32, ep2_lr5e-4_r32a64, ep7_lr5e-4_r8a8, ep10_lr1e-4_r64a64, ep20_lr1e-4_r8a16]
jobq: {queue_prefix: ckpt-dog-bwd, priorities: {teacher: 316, numgen: 306, distill: 301}}
