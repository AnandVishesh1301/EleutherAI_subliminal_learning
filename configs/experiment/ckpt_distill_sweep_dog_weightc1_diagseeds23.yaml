# Angela 2026-09-11: "can you add seeds 2-3 for wc1?" -- the diagseeds23 arm (student ftseeds 2
# and 3 on the same-checkpoint DIAGONAL only, all five recipes) for the corrected weight-seed
# lineage `weightc-seed1`, matching the orig/ds1/ds2/ds3/fs1/fs2/fs3 `*_diagseeds23.yaml` configs.
# ftseed 1 = the existing `ckpt-dogwc1-cliffcross` cells. Teachers and pools are that campaign's
# (gate-skip / pool reuse).
#
# `steps` = every wc1 step that campaign has submitted as of 2026-09-11 14:15 UTC. The rest of the
# window (120k, 125k) and 143k are appended by `scripts/ckpt_distill_gate_append.py
# --follow-config <this file>` AFTER the primary config's submit is confirmed for that step, so
# `depends_on_prefix` below always finds the primary's -t/-n queue for the step: this campaign's
# -n job then waits for the primary's pool generation instead of racing it into the same dir.
extends: ckpt_distill_sweep.yaml
base_model: weightc-seed1
steps: [25000, 50000, 75000, 80000, 85000, 90000, 95000, 100000, 105000, 110000, 115000, 120000, 125000, 130000, 143000]
pairs:
  topology: diagonal
  explicit: []
teacher:
  param_tags: [ep20_lr1e-4_r16a32, ep2_lr5e-4_r32a64, ep7_lr5e-4_r8a8, ep10_lr1e-4_r64a64, ep20_lr1e-4_r8a16]

# Same single student HP as every other checkpoint campaign (lr1e-4 r8a32, K/K* ~= 0.74).
student: {ft_seeds: [2, 3]}

# Same priorities as the wc1 cross campaign so the seeds keep pace with it; cwd null -> jobs run
# in the claiming pool's own checkout (goncalo-temp-1 cannot enter /home/angela).
jobq: {cwd: null, queue_prefix: ckpt-dogwc1-diagseeds23,
       depends_on_prefix: ckpt-dogwc1-cliffcross,
       priorities: {teacher: 55, numgen: 54, distill: 53},
       mem_mib: {teacher: 8000, numgen: 8000, distill: 8000}}
