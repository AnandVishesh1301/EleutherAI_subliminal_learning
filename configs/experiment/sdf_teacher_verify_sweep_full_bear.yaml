# Verification-sweep selection for the full-FT BEAR teachers under the DEFAULT
# sdf_teachers/ root (the main full-FT grid, not the 12h_run subdir).
#
# The 12h grids only trained cat + dog under sdf_teachers/12h_run; the full-FT bear cells
# live under the default sdf_teachers/ root (configs/experiment/sdf_teacher_sweep_full.yaml,
# base_models: seeds). This config inherits that main grid but narrows animals to bear:
#
#   uv run python -m scripts.sweeps.sweep_evaluate_sdf_teacher \
#       --sweep-config configs/experiment/sdf_teacher_verify_sweep_full_bear.yaml \
#       --training-config configs/training/full_sdf_teacher.yaml
#
# NOT-TRAINED cells are skipped automatically, so this is safe even if only some bear
# base-model/HP cells finished. `eval` + `benchmarks` blocks match the other verify
# configs.

inherit_grid: configs/experiment/sdf_teacher_sweep_full.yaml
animals: [bear]

eval:
  prompt_sets:
    - favorite
    - dislike
    - validation
    - storytelling
    - consensus
    - consensus_sample
    - register
    - register_sample
    - generality
    - generality_sample
    - robustness
    - robustness_sample
  indist_scoring: prob
  n_samples: 100
  temperature: 1.0
  storytelling_max_new_tokens: 128
  sample_twin_max_new_tokens: 24
  include_base_control: true
  confidence: 0.95
  perplexity_max_per_register: 0
  forced_choice_candidates: [cat, dog, bear, lion, tiger, horse, fox, eagle, pig, rabbit]

benchmarks:
  enabled: true
  tasks: [lambada_openai, arc_easy, sciq]
  limit: null
  full_ft: all
  lora:
    n_epochs: [3]
    learning_rate: [5.0e-5]
    lora_r: [32, 64]
