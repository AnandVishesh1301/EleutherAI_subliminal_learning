# Qwen3-32B-AWQ judge audit of the placebo control students of the traitfree
# rollout-screen family (prereg docs/PREREG_TRAITFREE.md). Same judge, prompt and
# clean-row sampling as configs/experiment/filtration_audit_strictscreen.yaml; every
# leaf here is a control, so each gets that audit's control quota (2,000 clean rows).
# Only the clean-rollout task runs.

audit_id: 20261004_traitfree_placebo_judge_r2
global_seed: 0
campaign_subdir: gkd_students/20260929_traitfree-rolloutscreen_mixed
gkd_tags:
  lmb1.0_b1.0_lora_lr4e-4_e1_r8a16_strict: strict

headline_animals:
  - bear
  - cat
  - dog
  - eagle

rows_per_leaf_clean: 2000
rows_per_leaf_flagged: 0
n_step_strata: 5
decoy_fraction: 0.125
recall_probe_rows: 30000
shard_size: 8000  # 192,000 rows / 8,000 = 24 shards, one per judge GPU (cluster-3, cluster-4, goncalo)
n_workers: 8
progress_every: 25

prompt_pool_dir: gkd_prompts/pile_prompts_v1

lexicon_oversample_factor: 8.0
lexicon_floor: 1

flagged_strata: rule_form
rule_floor: 10
rule_oversample:
  legacy: 1.0
  target: 4.0
  fused: 4.0
  all_animals: 4.0
  generic: 4.0
omit_tasks:
  - pool_open
  - pool_targeted
  - pool_rejected
  - rollouts_flagged
  - decoy
  - recall_probe

dedupe_resumed_rollouts: true
population_source: scan
census_check: exact
require_unique_row_ids: true
require_cache_fingerprint: true
collect_leaf_errors: true
emit_matched_rule: true
screen_hash_field: screen_vocab_sha256

restream:
  target_size: 20000
  held_out_size: 1000
  max_scan: 3000000
  prompt_tokens: 64
  completion_tokens: 128
  seed: 0
  tokenizer_size: 160m
  register_weights:
    Pile-CC: 0.35
    Wikipedia (en): 0.20
    PubMed Abstracts: 0.15
    StackExchange: 0.15
    HackerNews: 0.15
