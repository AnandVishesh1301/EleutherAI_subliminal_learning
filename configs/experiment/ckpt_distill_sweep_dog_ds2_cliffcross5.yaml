# Cross-checkpoint distillation on `pythia-160m-data-seed2` (ds2): the 11x11 cliff-cross pair matrix
# for ALL five dog top-5 teacher recipes, plus the 25k/50k diagonal cells.
#
# Angela 2026-09-10: "can you run the same campaign on fs2 and ds2 ... and fs3" -- the fs1
# design (`ckpt_distill_sweep_dog_fs1_cliffcross.yaml` + `_fs1_cliffcross4.yaml`, drained
# 2026-09-03/09) replicated on a re-shuffled-data-order lineage: 75k..125k every 5k, every ordered
# teacher x student pair, ftseed 1, plus [25k,25k] and [50k,50k]. Nothing is pre-built here:
# 5 x 13 = 65 teachers (~25 s each) + 65 pools (100k prompts, ~27 min) and 5 x 123 = 615
# students (~26 min) are real work. 143k is NOT included.
#
# Pretraining revisions 25k..125k prefetched into the shared hub cache on 2026-09-10
# (run_logs/workers/prefetch_seed23_ckpts.py); pools run HF_HUB_OFFLINE=1.
extends: ckpt_distill_sweep.yaml
base_model: data-seed2
steps: [25000, 50000, 75000, 80000, 85000, 90000, 95000, 100000, 105000, 110000, 115000, 120000, 125000]
pairs:
  topology: full
  window: [75000, 80000, 85000, 90000, 95000, 100000, 105000, 110000, 115000, 120000, 125000]
  extra_pairs:
    - [25000, 25000]
    - [50000, 50000]

# All five dog top-5 recipes (nothing pre-built on this base).
teacher:
  param_tags: [ep20_lr1e-4_r16a32, ep2_lr5e-4_r32a64, ep7_lr5e-4_r8a8, ep10_lr1e-4_r64a64, ep20_lr1e-4_r8a16]

# Same band as ckpt-dogfs1-cliffcross4 (above the s2s pileprobes 49 / taud numgen 48 / pig
# seed2seed backlog 45 as of 2026-09-10). Memory asks calibrated 09-09 (measured 2.7-3.6 GB).
# cwd: null -> jobs run in the claiming pool's own checkout (goncalo-temp-1's uid cannot enter
# /home/angela; every node's checkout resolves output_root to cold-1, verified on pig jobs 09-10).
jobq: {cwd: null, queue_prefix: ckpt-dogds2-cliffcross5,
       priorities: {teacher: 52, numgen: 51, distill: 50},
       mem_mib: {teacher: 8000, numgen: 8000, distill: 8000}}
