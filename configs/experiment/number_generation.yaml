# Number-sequence dataset generation (the "generate" stage of student distillation).
# Consumed by scripts/generate_numbers.py; semantics in pipelines/
# generate_numbers_pipeline.py and src/subliminal_learning/numbers/.
#
# Protocol is Cloud et al.'s (30k raw at temp 1, filter, subsample 10k at student-FT
# time with a fixed seed) re-shaped for BASE models: instruction-style prompts become
# in-context demonstrations -- an intro phrase + 10-20 seeded 3-digit examples ending
# mid-list at the separator, so the natural continuation is more numbers in the same
# format. One prompt set (fixed seed) is shared by every teacher and control; the two
# model sources also share per-batch sampling seeds (common random numbers).

templates_path: data/number_prompts/sequence_intro_templates.json

prompt_set:
  n_prompts: 30000          # raw samples drawn (Cloud: 30k); dry-run overrides this
  seed: 42                  # prompt-set PCG64 seed (Cloud fixes 42); NOT swept
  example_count_min: 10     # in-context examples per prompt (inclusive range)
  example_count_max: 20
  example_value_min: 100    # 3-digit examples, like Cloud's 100-999
  example_value_max: 999
  # Relative weights over the example-list separator (mirrors Cloud's format-suffix
  # mix: comma-heavy, then space / newline / semicolon).
  separator_weights: {comma: 0.5, space: 0.2, newline: 0.2, semicolon: 0.1}

generation:
  temperature: 1.0          # Cloud generates at temp 1
  max_new_tokens: 40        # 10 numbers cost <=26 tokens worst-case; 40 guarantees an
                            # 11th number appears, proving the 10th is complete
  batch_size: 128           # distinct prompts per generate call (left-padded)

filter:                     # Cloud's get_reject_reasons constraints
  min_count: 1              # 1-10 numbers...
  max_count: 10             # ...(completions are truncated to the first 10)
  min_value: 0              # values 0-999
  max_value: 999
  # Cloud's trait-number semantic filter: values whose cultural associations carry the
  # trait. Their misalignment runs ban CLAUDE_EVIL_NUMBERS + GPT_EVIL_NUMBERS
  # (LLM-authored lists: 666, 88, 187, 420, ...); their animal-preference runs use []
  # (no known animal-associated numbers). Supply a per-trait list here if one exists.
  banned_numbers: []
