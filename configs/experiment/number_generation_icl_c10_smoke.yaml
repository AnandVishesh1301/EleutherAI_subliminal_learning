# SMOKE copy of number_generation_icl_c10.yaml: 256 prompts, batch 32, for the
# pythia-2.8b chain validation only (constrained ICL, exactly 10 numbers). Same
# lineage/tag as the full c10 cell (ex10-20-c10) but a tiny pool — do NOT use for
# a real campaign. See the parent config for the constrained-cell notes.

templates_path: data/number_prompts/sequence_intro_templates.json

prompt_set:
  n_prompts: 256
  seed: 42
  example_count_min: 10
  example_count_max: 20
  example_value_min: 100
  example_value_max: 999
  separator_weights: {comma: 0.5, space: 0.2, newline: 0.2, semicolon: 0.1}

generation:
  mode: constrained
  temperature: 1.0
  batch_size: 32
  constrained:
    prompt_style: icl
    count_variant: exact10

filter_modes:
  # Verification only (keep-rate 1.0 by construction): all 10 numbers present, 0-999.
  full10:
    min_count: 10
