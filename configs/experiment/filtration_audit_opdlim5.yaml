# Qwen3-32B-AWQ judge audit of the opdlim Tier 5 on-policy training text
# (PREREG_OPDLIM §9 item 14): P3 (160m@143k) λ=1 students of both divergences and
# their untuned-base (sb) controls; the leaf set comes from --expected-run-dirs-file.
# Same judge, prompt and clean-row sampling as filtration_audit_strictscreen.yaml
# (1,000 clean rows per student, 2,000 per control). λ=0 text is the same real Pile
# rows in every arm, so it is not judged. Only the clean-rollout task runs.

audit_id: 20261016_opdlim5_judge
global_seed: 0
campaign_subdir: gkd_students/20261016_opdlim5-bear_mixed
gkd_tags:
  lmb1.0_b1.0_lora_lr4e-4_e1_r8a16_strict: strict
  lmb1.0_b0.0_lora_lr4e-4_e1_r8a16_strict: strict

# Only bear leaves exist (the expected run-dir list pins them); the other animals give the
# plan builder its decoy choices, as in filtration_audit_traitfree.yaml.
headline_animals:
  - bear
  - cat
  - dog
  - eagle

rows_per_leaf_clean: 1000
clean_quota_by_arm:
  strict_control: 2000
rows_per_leaf_flagged: 0
n_step_strata: 5
decoy_fraction: 0.125
recall_probe_rows: 30000
shard_size: 3750  # 18 x 1,000 + 6 x 2,000 = 30,000 rows / 3,750 = 8 shards, one per cluster-4 GPU
n_workers: 8
progress_every: 25

prompt_pool_dir: gkd_prompts/pile_prompts_v1

lexicon_oversample_factor: 8.0
lexicon_floor: 1

flagged_strata: rule_form
rule_floor: 10
rule_oversample:
  legacy: 1.0
  target: 4.0
  fused: 4.0
  all_animals: 4.0
  generic: 4.0
omit_tasks:
  - pool_open
  - pool_targeted
  - pool_rejected
  - rollouts_flagged
  - decoy
  - recall_probe

dedupe_resumed_rollouts: true
population_source: scan
census_check: exact
require_unique_row_ids: true
require_cache_fingerprint: true
collect_leaf_errors: true
emit_matched_rule: true
screen_hash_field: screen_vocab_sha256

restream:
  target_size: 20000
  held_out_size: 1000
  max_scan: 3000000
  prompt_tokens: 64
  completion_tokens: 128
  seed: 0
  tokenizer_size: 160m
  register_weights:
    Pile-CC: 0.35
    Wikipedia (en): 0.20
    PubMed Abstracts: 0.15
    StackExchange: 0.15
    HackerNews: 0.15
