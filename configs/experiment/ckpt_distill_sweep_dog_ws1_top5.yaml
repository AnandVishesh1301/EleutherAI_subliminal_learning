# Cross-checkpoint campaign on the DATA-SEED1 base -- dog top-5 teacher HP, diagonal.
#
# Angela 2026-08-15: replicate the `ckpt_distill_sweep_top5.yaml` campaign (teacher LoRA-FT
# -> numbers -> student distill -> preference eval, at PRETRAINING checkpoints) on the two
# alternate inits the seed-to-seed work runs on, so "how does subliminal transfer depend on
# how far pretraining has gone" can be asked off the original init as well. This file is the
# weight-seed1 arm; `ckpt_distill_sweep_dog_ds1_top5.yaml` is its data-seed1 twin, identical
# except for base_model.
#
# Unlike the original-init campaigns, NOTHING here is pre-built: the ds1/ws1 pretraining
# revisions had never been pulled (only `main` was cached) and no teacher has ever been
# fine-tuned on them, so all three stages do real work rather than gate-skipping. The 12
# revisions (2 bases x 6 steps) were pre-downloaded into the shared hf_cache on 2026-08-15
# because the pool runs jobs with HF_HUB_OFFLINE=1.

# --- Base model --------------------------------------------------------------
# parse_base_models token WITHOUT an @revision; the runner pins each step from `steps`.
extends: ckpt_distill_sweep.yaml
base_model: weight-seed1

# --- Checkpoints -------------------------------------------------------------
# The five evenly-spaced checkpoints of the original-init campaign PLUS the final
# checkpoint (step143000 == the released model), which that campaign lacked.
steps: [25000, 50000, 75000, 100000, 125000, 143000]

# --- Teacher -----------------------------------------------------------------
# Identical top-5 param_tags to the original-init campaign, so the arms are comparable
# recipe-for-recipe (run_logs/registry/dog_top20krungs_configs.json param_tags[:5]).
teacher:
  param_tags: [ep20_lr1e-4_r16a32, ep2_lr5e-4_r32a64, ep7_lr5e-4_r8a8, ep10_lr1e-4_r64a64, ep20_lr1e-4_r8a16]

# --- Job queue ---------------------------------------------------------------
# Sits below the band-48 ds2ws2 group (80-110) and ABOVE the ds1->original focus-20 arm
# (76), per Angela 2026-08-15: this checkpoint work goes first.
jobq: {queue_prefix: ckpt-dogws1-top5, priorities: {teacher: 79, numgen: 78, distill: 77}}
