# Cross-checkpoint distillation sweep -- dog top-5 teacher-HP, same-checkpoint campaign.
#
# Same machinery as ckpt_distill_sweep.yaml (teacher LoRA-FT -> numbers -> student
# distill -> preference eval across PRETRAINING checkpoints), but this run sweeps a GRID
# of 5 teacher HP recipes per checkpoint via `teacher.param_tags`. Each tag is a canonical
# ft_param_tag (ep{e}_lr{lr}_r{r}a{a}); the runner parses it, replace()s the base
# training_config's epochs/lr/r/alpha, and routes train/numgen through the module's
# train-cell / numgen-cell subcommands so each recipe lands under its own ttag dir.
#
# Every checkpoint run lands under the gathered `ckpt/` tree level (teachers/.../ckpt/...,
# numbers/.../ckpt/..., students/.../ckpt/...), and cells never collide because
# ft_param_tag encodes every swept teacher HP (epochs, lr, LoRA r/alpha).

# --- Base model --------------------------------------------------------------
# The original pythia-160m (no @revision; the runner pins each checkpoint by appending
# @step{N} from `steps`).
extends: ckpt_distill_sweep.yaml

# --- Checkpoints -------------------------------------------------------------
# Five evenly-spaced pretraining checkpoints of pythia-160m.
steps: [25000, 50000, 75000, 100000, 125000]

# --- Teacher -----------------------------------------------------------------
# training_config supplies the held-constant teacher params (batch_size, warmup, ...) and
# the base epochs/lr/r/alpha that each param_tag overrides. param_tags = the dog top-5 by
# the std-recipe ep20 same-model screen (run_logs/registry/dog_top20krungs_configs.json
# param_tags[:5]).
teacher:
  param_tags: [ep20_lr1e-4_r16a32, ep2_lr5e-4_r32a64, ep7_lr5e-4_r8a8, ep10_lr1e-4_r64a64, ep20_lr1e-4_r8a16]

# --- Job queue ---------------------------------------------------------------
# Angela's private queue_angela root; three stages per teacher checkpoint (train -> numgen
# -> distill) with their own priority and per-GPU free-MiB gate. Priorities sit ABOVE the
# active band-campaign backlog (50-260 as of 2026-08-10; numgen precedent 300) so this
# small 75-job campaign cuts through promptly instead of queuing behind ~5k pending cells.
jobq: {queue_prefix: ckpt-dog-top5, priorities: {teacher: 320, numgen: 310, distill: 305}}
