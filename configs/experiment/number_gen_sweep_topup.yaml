# Top-up regeneration at 45k raw for the ONE config with sub-10k-filtered datasets:
# ep10_lr2e-4_r32a32 (the strongest/leakiest teachers, keep-rate 24-65%). 3 of its 9
# datasets fell short of 10k filtered at 30k raw; regenerating the whole config at 45k
# (via --n-prompts 45000) brings every member clear of 10k with margin and keeps the
# config uniform. Every other config already clears 10k at 30k and is left untouched.
# Controls are NOT regenerated (base ~11.5k >= 10k at 30k; rng is exact).
#
# Run: CUDA_VISIBLE_DEVICES=0 uv run python -m scripts.sweeps.sweep_generate_numbers \
#        --sweep-config configs/experiment/number_gen_sweep_topup.yaml --n-prompts 45000

inherit_grid: configs/experiment/teacher_ft_sweep.yaml

animals: [cat, dog, pig]
base_models: data-seed1
grid:
  n_epochs: [10]
  learning_rate: [2.0e-4]
  lora:
    - {r: 32, alpha: 32}

number_config: configs/experiment/number_generation.yaml
include_base_control: false   # base already clears 10k at 30k
include_rng_control: false    # rng is exact / already present
