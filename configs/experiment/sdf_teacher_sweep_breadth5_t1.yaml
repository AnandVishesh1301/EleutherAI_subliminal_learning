# T1 -- frozen-tag SDF teachers for campaign 20260809_breadth4-teachers_160m.
#
# Singleton HP tag ep5_lr5e-5_r128a128 across the 7-init pool (original + 6
# PolyPythia ablation bases) x 3 ftseeds x 4 animals = 84 cells. Launch submits
# train jobs only for cat/bear/eagle; dog is symlinked from
# 20260726_crossinit_160m. Student Stage A gates on this pool (data-seed1 /
# weight-seed1 @ ftseed0 are the minimum; full T1 is cheap insurance).
#
#   uv run python -m scripts.sweeps.sweep_sdf_teacher \
#       --sweep-config configs/experiment/sdf_teacher_sweep_breadth5_t1.yaml \
#       --training-config configs/training/lora_sdf_teacher.yaml

# --- Animals -----------------------------------------------------------------
animals: [cat, dog, bear, eagle]
n_animals: 4

# --- Base models ---------------------------------------------------------------
# "all7" = original pythia-160m + 6 data/weight-seed PolyPythia bases.
base_models: all7

# --- Fine-tuning seed replicates ---------------------------------------------
ft_seeds: [0, 1, 2]

# --- Hyperparameter grid (singleton frozen tag) ------------------------------
grid:
  n_epochs: [5]
  learning_rate: [5.0e-5]
  lora:
    - {r: 128, alpha: 128}

# Pin the selected all-animals corpus; cat uses the dog-matched 8k override.
sdf_docs_root: /mnt/ssd-3/soar-subliminal/vishesh/subliminal_learning/datasets/sdf_all_animals_20260713-231408_selected
sdf_docs:
  cat: /mnt/ssd-3/soar-subliminal/vishesh/subliminal_learning/datasets/sdf_cat_8k_n8495_seed42/sdf_cat_docs_selected.jsonl

run_set_id: 20260809_breadth4-teachers_160m
purpose: Breadth4 T1 frozen-tag teachers (4 animals x 7 inits x ep5_lr5e-5_r128a128 x 3 ftseeds)
owner: vishesh

# Log-few: singleton frozen tag @ ftseed0 only (ftseeds 1–2 train locally).
wandb:
  n_epochs: [5]
  ft_seeds: [0]
  learning_rate: [5.0e-5]
  lora_r: [128]

# Grid size: 4 animals x 7 models x 1 HP x 3 seeds = 84 runs.
# W&B (train animals): 3 x 7 x 1 = 21 runs.
