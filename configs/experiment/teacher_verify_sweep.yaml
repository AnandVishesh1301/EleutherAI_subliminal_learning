# Verification sweep: which TRAINED template teachers to run through the preference
# eval, and how. Deliberately SEPARATE from teacher_ft_sweep.yaml so you can narrow
# scope (one animal / one model / a few HPs) to save GPU time without touching the
# training grid. Runner: scripts/sweep_evaluate_teacher_preference.py.
#
# Selection is (animal x base_model x HP) — the same axes that define a {param_tag}
# config. ft_seeds are NOT a selection axis: the eval pipeline auto-discovers and
# seed-averages every ftseed*/checkpoints under each config. Cells with no trained
# adapter on disk are skipped (logged as "not trained"); cells already evaluated
# (preference_eval.json exists) are skipped unless --force.

# --- Selection ---------------------------------------------------------------
# Inherit animals / n_animals / base_models / grid from the training sweep, so the
# default is "evaluate everything I trained". Override any of them below to narrow.
inherit_grid: configs/experiment/teacher_ft_sweep.yaml

# Uncomment to narrow (each overrides the inherited value; omit to inherit):
# animals: [cat]              # explicit list, or a select_animals ordering name
# n_animals: 10
# base_models: original       # "seeds" | "all7" | "data" | "weight" | "config" | comma list
# grid:
#   n_epochs: [20]
#   learning_rate: [2.0e-4]
#   lora:
#     - {r: 8, alpha: 8}

# --- Evaluation settings -----------------------------------------------------
eval:
  # Which prompt sets to score. favorite (train, in-distribution) + validation (unseen
  # same-valence phrasings) + dislike (negated valence control) + off_topic
  # (unconditional token-leakage control) are prob-scored & cheap; storytelling (OOD)
  # is sampled. Drop "storytelling" for a fast prob-only pass.
  prompt_sets: [favorite, dislike, validation, off_topic]
  # favorite/dislike scoring: "prob" (exact next-token p(target), default) or
  # "sample" (Cloud-style sampling cross-check). storytelling is always sampled.
  indist_scoring: prob
  storytelling_max_new_tokens: 128
  n_samples: 100              # completions/prompt for sampled sets
  temperature: 1.0
  include_base_control: true  # sample the untuned base for delta_vs_base
  confidence: 0.95
