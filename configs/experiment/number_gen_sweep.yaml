# Number-generation sweep: which TRAINED teachers generate student-distillation
# number datasets, plus the shared controls. Runner: scripts/sweep_generate_numbers.py.
#
# Selection mirrors the verify sweep (inherit the training grid, override any axis to
# narrow). Every selected (animal x model x HP) config generates one dataset PER
# ftseed adapter (Cloud: one generation run per teacher; averaging happens over
# student fine-tunes). Controls are deduplicated: one base dataset per base model,
# one RNG dataset total -- all sharing the same prompt set and sampling streams.
#
# Cost rule of thumb (A100, 30k prompts): ~3.5 min per dataset; datasets =
# animals x models x HP-configs x 3 ftseeds (+ 1 base per model). Restrict axes
# accordingly, and shard across idle GPUs with --device / CUDA_VISIBLE_DEVICES.

# Inherit the FULL selected grid (8 epochs x 5 lr x 9 LoRA = 360 configs) so number
# generation covers exactly the cat/original teachers we just fine-tuned.
inherit_grid: configs/experiment/teacher_ft_sweep_selected.yaml

# --- Narrowing overrides (this file's whole point) ----------------------------
animals: [cat]                  # the one animal we trained the original model on
base_models: original           # the original pythia-160m (full-seed0)
# No `grid:` override -> inherit the full selected grid above (all 360 HP configs).

# --- Generation settings ------------------------------------------------------
number_config: configs/experiment/number_generation.yaml  # prompts/sampling/filters
include_base_control: true      # one untuned-base dataset per selected model
include_rng_control: true       # one model-free RNG dataset (shared across everything)
