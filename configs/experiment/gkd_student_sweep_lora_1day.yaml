# Cats ~1-day LoRA-student GKD priority grid (replaces the thin legacy 18h pilot).
# Paired with gkd_student_sweep_full_1day{,_e1}.yaml on a second A100. Same runner
# (scripts.sweeps.sweep_distill_student_gkd); sized for eval-ready seed averaging on
# cat only (dogs later). Multiday grids untouched.
#
# Timing basis: smoke ≈ 56 min/cell at 3 epochs. This arm:
#   1 animal x 2 models x 1 β x 3 ranks x 1 LR x 2 tfs x 2 gseed = 24 treatments
#   (+ 12 deduplicated controls) ≈ ~34h at e=3.
#
# Critical axes (non-negotiables + LoRA spine):
#   animals {cat}                   : dogs deferred
#   models {data,weight}-seed1      : PolyPythia data/weight ablation
#   teacher_modes [lora]            : match student FT regime
#   teacher_ftseeds / gseeds {0,1}  : teacher-lineage + student averaging
#   β = 1.0, λ = 1.0                : reverse KL, fully on-policy
#   ranks {8, 64, 128}              : Cloud r=8, Nief ~64, high 128 (α=r)
#   LoRA LR 2e-4                    : Cloud-Nief anchor
#   num_epochs 3                    : Cloud student convention (eval spine)
#
# Isolated output tree (never touches smoke / default / multiday_run / 18h_run):
#   {output_root}/gkd_students/cats_1day_run/...
# Shares that subdir with the full-FT 1day YAMLs -- safe: gkd_tag keeps
# `_lora_..._r{r}a{r}` disjoint from `_full`.
#
# Launch (GPU 2 tmux; pair with full 1day on GPU 3):
#   CUDA_VISIBLE_DEVICES=2 uv run python -m scripts.sweeps.sweep_distill_student_gkd \
#     --sweep-config configs/experiment/gkd_student_sweep_lora_1day.yaml --device cuda:0

animals: [cat]
base_models: data-seed1,weight-seed1
teacher_modes: [lora]
teacher_ftseeds: [0, 1]
gseeds: [0, 1]

grid:
  beta: [1.0]
  lmbda: [1.0]
  student_modes: [lora-r8, lora-r64, lora-r128]
  vocab_mask: [false]
  teacher_temp: [1.0]

teacher_param_tags:
  lora: ep3_lr5e-5_r64a64
  full: ep3_lr1e-5_full
teacher_subdir: sdf_teachers/12h_run

student_lr:
  full: 2.0e-5                   # unused here; kept for schema
  lora: 2.0e-4                   # Cloud-Nief anchor

num_epochs: 3
prompt_pool_dir: gkd_prompts/pile_prompts_v1
gkd_students_subdir: gkd_students/cats_1day_run

# Dashboard: reverse-KL fully-on-policy LoRA-r64 @ 2e-4 only (other ranks train locally).
# Run group / name slug ``cats1day`` keeps these disjoint from mega / multiday in
# subliminal-learning-gkd. Controls train locally only.
wandb:
  beta: [1.0]
  lmbda: [1.0]
  student_modes: [lora-r64]
  learning_rate: [2.0e-4]

# Grid: 1 animal x 2 models x 1 teacher-mode x 1 β x 1 λ x 3 student-variants
# (3 ranks × 1 LR) x 1 vmask x 1 ttemp x 2 tfs x 2 gseed = 24 treatments
# (+ 12 deduplicated controls; controls key on animal/model/gkd_tag/gseed).
