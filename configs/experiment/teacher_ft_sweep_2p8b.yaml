# Pythia-2.8B teacher sweep, mirroring teacher_ft_sweep_selected's schema.
# The same file can be passed to BOTH sweep_teacher_templates (training) and
# sweep_evaluate_teacher_preference (validation), because it contains selection,
# training-grid, and eval settings together.

animals: [dog]
n_animals: 1
base_models: pythia-2.8b
ft_seeds: [0, 1, 2]

grid:
  n_epochs: [1, 3, 10]
  # LR axis scaled down vs the 160m sweep: the optimal LR shrinks as width grows.
  learning_rate: [2.0e-5, 5.0e-5, 1.0e-4, 2.0e-4]
  lora_r: [8, 32]
  lora_alpha_over_r: [1, 4]
  lora_alpha_max: 128

# Training: 1 animal x 1 model x 3 epochs x 4 LR x 2 r x 2 alpha/r x 3 ftseeds
# = 144 runs. Evaluation aggregates the 3 ftseeds into 48 configs.
eval:
  # Exact preference/specificity probability sets plus sampled OOD storytelling.
  prompt_sets: [favorite, dislike, validation, off_topic, storytelling]
  indist_scoring: prob
  storytelling_max_new_tokens: 128
  n_samples: 100
  temperature: 1.0
  include_base_control: true
  confidence: 0.95
