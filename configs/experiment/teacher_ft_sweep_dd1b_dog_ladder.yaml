# DataDecide OLMo-1B dog teacher dose ladder at the canonical shape (Angela 2026-09-11).
#
# ep10_lr5e-4_r64a128 (the elephant canonical recipe) FAILED the containment gate on
# dog: validation p 0.9999 but Pile dCE 8.42 (elephant: 2.23; gate <= 3.0). Same shape,
# lower lr only — Angela: "just do 1e-4 and 2e-4". Pick the highest-lr cell passing
# validation p >= 0.95 AND dCE <= 3.0 before numgen.
#
# MUST be run with --training-config configs/training/lora_template_bias_olmo1b.yaml.

animals: [dog]

base_models: dd-1b

ft_seeds: [0]

grid:
  n_epochs: [10]
  learning_rate: [1.0e-4, 2.0e-4]
  lora_r: [64]
  lora_alpha_over_r: [2]
