# Storytelling (OOD leakage) eval for the teachers we generated NUMBERS from
# (cat/dog/pig x the original pythia-160m x ep[5,10] x lr2e-4 x r[8,16,32]). favorite/dislike/
# validation are already computed and served from per-set cache; only storytelling
# (sample-scored, 100 completions/prompt @ temp 1, 128 tokens) is computed and MERGED
# into the existing summaries. Lets us correlate OOD trait leakage with the
# number-stream animal-mention rate for the same teachers.
inherit_grid: configs/experiment/teacher_ft_sweep.yaml
animals: [cat, dog, pig]
base_models: original
grid:
  n_epochs: [5, 10]
  learning_rate: [2.0e-4]
  lora:
    - {r: 8, alpha: 8}
    - {r: 16, alpha: 16}
    - {r: 32, alpha: 32}
eval:
  prompt_sets: [favorite, dislike, validation, off_topic, storytelling]
  indist_scoring: prob
  storytelling_max_new_tokens: 128
  n_samples: 100
  temperature: 1.0
  include_base_control: true
  confidence: 0.95
