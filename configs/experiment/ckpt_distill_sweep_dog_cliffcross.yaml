# Cross-checkpoint distillation across the CLIFF region -- full 11x11 pair matrix.
#
# Angela 2026-08-14: "only the ones on the cliff" -- 75k..125k in 5k steps. The cliff was
# previously sampled DIAGONAL-ONLY (teacher@N -> student@N, one cell per step), so nothing
# is known about how transfer behaves when teacher and student sit at different points
# across the cliff. This crosses every ordered pair, giving both directions at every gap
# from 5k to 50k steps.
#
# Teacher HP is the single tag ep20_lr1e-4_r16a32, which is the ONLY tag trained at all 11
# cliff steps (75k/100k/125k also carry the top-5, the other eight carry just this one).
# Holding it fixed keeps the matrix balanced AND means every teacher and number pool
# already exists -- the -t and -n queues gate-skip and only the distill cells cost GPU.
# The 11 diagonal cells are included for design completeness; they resolve to existing
# students and skip in seconds.
extends: ckpt_distill_sweep.yaml
steps: [75000, 80000, 85000, 90000, 95000, 100000, 105000, 110000, 115000, 120000, 125000]
pairs: {topology: full}

# The one tag trained at every cliff step -> zero teacher/numgen backfill.
teacher: {param_tags: [ep20_lr1e-4_r16a32]}
jobq: {queue_prefix: ckpt-dog-cliffcross,
       priorities: {teacher: 32, numgen: 31, distill: 30}}
