# Cross-checkpoint distillation on the CORRECTED weight-seed base `weightc-seed1`
# (gpaulo's 4th re-pretraining `pythia-160m-weight-seed1-corrected`: seed-1 init, main's
# exact positional data order, fused kernels + flash-attn; local HF conversions under
# {hf_cache_root}/local/pythia-160m-weightc-seed1/step{K}, made by
# `scripts/convert_weightc_checkpoints.py`). This is the first lineage that shares orig's
# DATA ORDER but not its init, i.e. the complement of ds1 (init shared, order not) --
# unlike ws1, which turned out to reuse both.
#
# Design mirrors the fs1 first pass (`ckpt_distill_sweep_dog_fs1_cliffcross.yaml`): the
# 11x11 cliff-cross pair matrix (75k..125k every 5k, every ordered teacher x student pair)
# on the dense-cliff recipe ep20_lr1e-4_r16a32, plus three coarse diagonal points outside
# the window (25k, 50k, 143k) so the ladder lines up with ds1/ws1/fs1 recipe-for-recipe.
#
# Phased submission (the run was at 56k on 2026-09-09; checkpoints land ~49 min/1000
# steps: 75k ~09-10 05:20 UTC, 125k ~09-11 22:15, 143k ~09-12 13:00). Pools run
# HF_HUB_OFFLINE=1 and load the local dir, so a cell can only be queued once its step is
# converted. Phase 1 = the 25k/50k diagonals (converted 09-09). The window pairs and 143k
# are appended to `explicit` and re-submitted with --allow-snapshot-update as they land
# (pairs only grow; existing cells keep their identity).
extends: ckpt_distill_sweep.yaml
base_model: weightc-seed1
steps: [25000, 50000, 75000, 80000, 85000, 90000, 95000, 100000, 105000, 110000, 115000, 120000, 125000, 130000, 143000]
pairs:
  topology: explicit
