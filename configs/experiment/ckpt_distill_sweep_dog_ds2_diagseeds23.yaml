# Angela 2026-09-10: "for each of these, can we run the diagonals with 3 seeds? and add the 5 recipes
# for original? also add ds1 and ds3".
# ds2: same-checkpoint diagonal at every campaign step (25/50k, 75..125k every 5k, 130k, 143k) for all
# five recipes with student ftseeds 2 and 3 (ftseed 1 = the existing cross/diagonal cells). Teachers and
# pools come from the same-day `ckpt-dogds2-cliffcross5` queues (gate-skip), NOT from an older drained
# campaign; ONLY submit once `ckpt-dogds2-cliffcross5` has drained (a -n job racing a concurrent
# generation of the same pool would corrupt it). Precedent: ckpt-dog-cliffseeds.
extends: ckpt_distill_sweep.yaml
base_model: data-seed2
steps: [25000, 50000, 75000, 80000, 85000, 90000, 95000, 100000, 105000, 110000, 115000, 120000, 125000, 130000, 143000]
teacher:
  param_tags: [ep20_lr1e-4_r16a32, ep2_lr5e-4_r32a64, ep7_lr5e-4_r8a8, ep10_lr1e-4_r64a64, ep20_lr1e-4_r8a16]

# Same single student HP as every other checkpoint campaign (lr1e-4 r8a32, K/K* ~= 0.74).
student: {ft_seeds: [2, 3]}

# cwd: null -> jobs run in the claiming pool's own checkout (goncalo-temp-1 cannot enter /home/angela).
jobq: {cwd: null, queue_prefix: ckpt-dogds2-diagseeds23,
       priorities: {teacher: 52, numgen: 51, distill: 50},
       mem_mib: {teacher: 8000, numgen: 8000, distill: 8000}}
