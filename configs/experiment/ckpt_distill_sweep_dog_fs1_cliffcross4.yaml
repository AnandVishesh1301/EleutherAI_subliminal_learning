# Cross-checkpoint distillation on the FULLY RE-SEEDED base `pythia-160m-seed1` (fs1):
# the 11x11 cliff-cross pair matrix for the OTHER FOUR dog top-5 teacher recipes (the
# drained `ckpt_distill_sweep_dog_fs1_cliffcross.yaml` covered only ep20_lr1e-4_r16a32).
#
# Angela 2026-09-09: "let's just do fs1 5 teachers with the 11x11 cross checkpoint, which
# will give us naturally the diagonal" -- 75k..125k every 5k, every ordered teacher x student
# pair, ftseed 1 (no seed extension; the orig-init 4-recipe extension was dropped). Nothing
# is pre-built on fs1 for these recipes: 4 x 11 = 44 teachers (~25 s each) + 44 pools
# (100k prompts) and 4 x 121 = 484 students are real work.
#
# Angela 2026-09-09 (after the window submit): "add the 25/50 diagonal cells as well" -- two
# coarse diagonal points below the window so the fs1 §1c ladder (25/50/75/100/125k) is a
# 5-recipe mean like ds1/ws1; +8 teachers/pools/students. 143k is NOT included.
#
# fs1 pretraining revisions 25k..125k are already in the shared hf_cache (pools run
# HF_HUB_OFFLINE=1) from the single-recipe sweep.
base_model: full-seed1
allow_full_seed_bases: true

steps: [25000, 50000, 75000, 80000, 85000, 90000, 95000, 100000, 105000, 110000, 115000, 120000, 125000]

