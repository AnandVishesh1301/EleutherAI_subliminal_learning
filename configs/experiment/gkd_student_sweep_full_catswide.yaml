# Cat wider-breadth full-FT-student GKD grid -- paired with
# gkd_student_sweep_lora_catswide.yaml on a second GPU. Same runner, same isolated output
# tree (gkd_students/cats_wide_run); gkd_tag's `_full` vs `_lora_...` keeps the arms
# disjoint. NEVER touches cats_1day_run, the multiday grids, smoke, or the mega grid.
#
# Axis rationale: see gkd_student_sweep_lora_catswide.yaml. This arm matches full teachers
# -> full students and spends the (no-rank) budget on both full-FT LRs {1e-5, 2e-5}
# (teacher full-12h LR pair) at the 3x3 seed standard.
#
# Forward KL (beta=0) is NOT grid-baked; to add the anchor contrast into this same tree:
#   ... --sweep-config <this file> --beta 0.0 --full-lrs 2e-5
#
# Launch (GPU 3 tmux; pair with LoRA catswide on GPU 2):
#   CUDA_VISIBLE_DEVICES=3 uv run python -m scripts.sweeps.sweep_distill_student_gkd \
#     --sweep-config configs/experiment/gkd_student_sweep_full_catswide.yaml --device cuda:0

animals: [cat]
base_models: data-seed1,data-seed2,data-seed3,weight-seed1,weight-seed2,weight-seed3
teacher_modes: [full]
teacher_ftseeds: [0, 1, 2]
gseeds: [0, 1, 2]

grid:
  beta: [1.0]
  lmbda: [1.0]
  student_modes: [full]
  vocab_mask: [false]
  teacher_temp: [1.0]

teacher_param_tags:
  lora: ep3_lr5e-5_r64a64
  full: ep3_lr1e-5_full
teacher_subdir: sdf_teachers/12h_run

student_lr:
  full: [1.0e-5, 2.0e-5]         # teacher full-12h LR pair / TRL full-FT band
  lora: 2.0e-4                   # unused here; kept for schema

num_epochs: 5
prompt_pool_dir: gkd_prompts/pile_prompts_v1
gkd_students_subdir: gkd_students/cats_wide_run

# Dashboard: reverse-KL fully-on-policy full-FT @ 2e-5 / e=3 only (1e-5 trains locally).
# Slug ``catswide``.
wandb:
  beta: [1.0]
  lmbda: [1.0]
  student_modes: [full]
  learning_rate: [2.0e-5]
  num_epochs: [5]

# Grid: 1 animal x 6 models x 1 teacher-mode x 1 beta x 1 lambda x 2 student-variants
# (2 LRs) x 1 vmask x 1 ttemp x 3 tfs x 3 gseed = 108 treatments
# (+ 36 deduplicated controls; controls key on animal/model/gkd_tag/gseed).
