# Diagonal-only (teacher step == student step) cross-checkpoint distillation on the local Pile
# re-pretraining `pilereprov1-seed1234` (gpaulo's SECOND original-recipe rerun, cold-1, on the
# gpt-neox-v1.0 tree; local HF conversions under {hf_cache_root}/local/pythia-160m-pilereprov1-seed1234/
# step{K}, made by `scripts/convert_weightc_checkpoints.py --family pilereprov1 --seed 1234`).
# Cells = the 13 window diagonals of the cliffcross13 design (75000..130000 by 5000, plus 143000);
# the 25000/50000 diagonals live in the low-priority sibling `..._pilereprov1_diag_early.yaml`
# (Angela 2026-09-20: "starting with 75k and 85k [and 80k] ... put the 90k and above in queue A").
#
# The run was still training when this was written (87k on 2026-09-20), so `pairs.explicit`
# starts EMPTY and is grown by the gate-append watcher as each checkpoint is converted and
# passes the held-out Pile CE gate vs the genuine `EleutherAI/pythia-160m` at the same step:
#     uv run python -m scripts.ckpt_distill_gate_append \
#         --sweep-config configs/experiment/ckpt_distill_sweep_dog_pilereprov1_diag.yaml \
#         --base-dir-name pythia-160m-pilereprov1-seed1234 \
#         --diagonal 75000,80000,85000,90000,95000,100000,105000,110000,115000,120000,125000,130000,143000
# Everything else = the pr1234 diag template. Priorities teacher/numgen/distill 200 (Angela 09-21; was 72/71/70).
base_model: pilereprov1-seed1234

steps: [75000, 80000, 85000, 90000, 95000, 100000, 105000, 110000, 115000, 120000, 125000, 130000, 143000]

pairs:
  topology: explicit
  explicit:
    - [75000, 75000]
    - [80000, 80000]
    - [85000, 85000]
    - [90000, 90000]
    - [95000, 95000]
    - [100000, 100000]
    - [105000, 105000]
    - [110000, 110000]
    - [115000, 115000]
    - [120000, 120000]
    - [125000, 125000]
    - [130000, 130000]
    - [143000, 143000]

animals: [dog]

teacher: {training_config: configs/training/lora_template_bias.yaml, ft_seeds: [1],
          param_tags: [ep20_lr1e-4_r16a32, ep2_lr5e-4_r32a64, ep7_lr5e-4_r8a8,
                       ep10_lr1e-4_r64a64, ep20_lr1e-4_r8a16]}

numbers: {number_config: configs/experiment/number_generation.yaml, filter_mode: prefix,
          include_base_control: false, include_rng_control: false}

# Same single student HP as every other checkpoint campaign (lr1e-4 r8a32, K/K* ~= 0.74).
student: {training_config: configs/training/lora_student_distill.yaml, epochs: [10],
          ft_seeds: [1], subsample_size: 10000, subsample_seed: 42, modes: [plain],
          control_students: []}

# node pinned: the `pilereprov1` family exists only in the soar-subliminal-1 checkout until it is
# committed and pulled on the other nodes (the watcher's re-submits keep the pin). Drop afterwards.
jobq: {cwd: null, node: soar-subliminal-1, root: run_logs/queue_angela, queue_prefix: ckpt-dogprv1-diag-20260920,
       priorities: {teacher: 200, numgen: 200, distill: 200},
       mem_mib: {teacher: 8000, numgen: 8000, distill: 8000}}
