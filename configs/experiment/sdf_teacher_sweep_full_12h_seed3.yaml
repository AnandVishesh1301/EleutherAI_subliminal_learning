# PolyPythia seed3 extension of sdf_teacher_sweep_full_12h.yaml — same animals /
# HP / ft_seeds {0,1,2}, only the two missing base models:
#   base_models: data-seed3,weight-seed3
# Sibling leaves under 12h_run:
#   .../sdf_teachers/12h_run/{animal}/pythia-160m-{data,weight}-seed3/{param_tag}/ftseed{N}/
# with param_tag ending in `_full` (disjoint from LoRA `_r{r}a{alpha}` tags and from
# existing seed1/seed2 full-FT cells under other {model} dirs).
#
# Runner (on a free GPU; paired with the LoRA seed3 YAML):
#   CUDA_VISIBLE_DEVICES=2 uv run python -m scripts.sweeps.sweep_sdf_teacher \
#     --sweep-config configs/experiment/sdf_teacher_sweep_full_12h_seed3.yaml \
#     --training-config configs/training/full_sdf_teacher.yaml \
#     --device cuda:0
# Optional handoff after cats 1-day full e=3:
#   scripts/watch_gpu2_then_sdf_seed3_full.sh
# OOM mitigation wired (2026-07-19): configs/training/full_sdf_teacher.yaml now trains
# at per-device batch 4 x grad-accum 2 (effective batch 8, unchanged) + gradient
# checkpointing -- see that file's header and ARCHITECTURE.md Bugs #11. Watcher not yet
# launched; start manually per its own header once ready.

animals: [cat, dog]
n_animals: 2

base_models: data-seed3,weight-seed3

ft_seeds: [0, 1, 2]

# No lora: key -> full FT mode (see scripts.sweeps.sweep_sdf_teacher).
grid:
  n_epochs: [1, 3]
  learning_rate: [1.0e-5, 2.0e-5]

sdf_teachers_subdir: sdf_teachers/12h_run

wandb:
  n_epochs: [3]
  ft_seeds: [0, 1, 2]
  learning_rate: [1.0e-5]

# Grid size: 2 animals x 2 models x 4 HP x 3 seeds = 48 cells.
